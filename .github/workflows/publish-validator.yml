name: Publish validator to npm

on:
  push:
    tags:
      - "validator-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @mcpdesc/validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#validator-v}"
          package_version="$(node -p "require('./packages/validator/package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match package version $package_version" >&2
            exit 1
          fi
          npm install --global npm@11
          npm --version

      - name: Run validator checks
        run: npm test --workspace @mcpdesc/validator

      - name: Publish validator
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#validator-v}"
          if [[ "$version" == *-* ]]; then
            npm publish --workspace @mcpdesc/validator --access public --tag next --provenance
          else
            npm publish --workspace @mcpdesc/validator --access public --tag latest --provenance
          fi
name: validate

on:
  push:
    branches:
      - main
      - "draft/**"
  pull_request:
    branches:
      - main
      - "draft/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate specification, schemas, and examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository validation
        run: npm test

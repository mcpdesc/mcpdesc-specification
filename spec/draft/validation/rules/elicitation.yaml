rules:
  - id: mcp.elicitation.revision-availability
    title: "Use elicitation only where the version supports it"
    description: >-
      Elicitation forms and URL flows are not available in every MCP protocol
      version. Scope declarations and interaction examples to the versions
      that define the chosen mode. Describing an interaction does not make
      that interaction available in an older protocol version.
    owner: mcp
    summary: >-
      Elicitation is used only from MCP 2025-06-18, and URL mode only from MCP
      2025-11-25, in declarations and in Tool interaction steps.
    surface: ElicitRequest
    path: mode
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Sections 9.4 and 12.5
        locations:
          - sections/12-elicitation.md#req-elicitation-revisions
          - sections/09-tools.md#req-interaction-revision-valid
    sources:
      - tier: 1
        reference: MCP 2025-03-26 schema.ts (no elicitation/create); MCP 2025-06-18 schema.ts, ElicitRequest (form only); MCP 2025-11-25 and 2026-07-28 schema.ts, ElicitRequestURLParams (mode "url")
        locations:
          - validation/mcp-schemas/2025-03-26/schema.ts#L202-L223
          - validation/mcp-schemas/2025-06-18/schema.ts#L1453-L1477
          - validation/mcp-schemas/2025-11-25/schema.ts#L2180-L2208
          - validation/mcp-schemas/2026-07-28/schema.ts#L2813-L2838
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/elicitation-version-mismatch.json
        pointer: /tools/0/elicitations/0
        outcome: error
      - path: expected-invalid/invalid-tool-interaction-example-semantics.json
        pointer: /tools/0/interactionExamples/broken/steps/0/request
        outcome: error
    notes: >-
      Elicitation Declarations scoped before MCP 2025-06-18 are outside the
      complete semantic checks (Section 16.2).

  - id: mcp.elicitation.form-schema.revision-shape
    title: "Use the applicable elicitation form vocabulary"
    description: >-
      The allowed form-schema vocabulary depends on the MCP protocol version.
      Check the fields of requestedSchema against that vocabulary rather than
      assuming a general Tool JSON Schema can be copied into an elicitation
      form unchanged.
    owner: mcp
    summary: >-
      In MCP 2025-06-18, a form requestedSchema has no $schema, no array or
      titled enum properties, and default only on boolean properties.
    surface: ElicitRequest
    path: requestedSchema
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": not-applicable
        "2025-03-26": not-applicable
        "2025-06-18": applies
        "2025-11-25": not-applicable
        "2026-07-28": not-applicable
    specification:
      - reference: MCP Description 0.9.0, Section 12.3
        locations:
          - sections/12-elicitation.md#req-elicitation-form-vocabulary
    sources:
      - tier: 1
        reference: MCP 2025-06-18 schema.ts, ElicitRequest requestedSchema and PrimitiveSchemaDefinition (default only on BooleanSchema; EnumSchema with enum and enumNames)
        locations:
          - validation/mcp-schemas/2025-06-18/schema.ts#L1453-L1477
          - validation/mcp-schemas/2025-06-18/schema.ts#L1479-L1486
          - validation/mcp-schemas/2025-06-18/schema.ts#L1517-L1525
          - validation/mcp-schemas/2025-06-18/schema.ts#L1527-L1536
      - tier: 1
        reference: MCP 2025-11-25 schema.ts, requestedSchema $schema, default on all primitive schemas, titled and multi-select enum schemas
        locations:
          - validation/mcp-schemas/2025-11-25/schema.ts#L2150-L2178
          - validation/mcp-schemas/2025-11-25/schema.ts#L2228-L2235
          - validation/mcp-schemas/2025-11-25/schema.ts#L2463-L2464
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/elicitation-form-schema-2025-06-18.json
        pointer: /prompts/0/elicitations/0/requestedSchema
        outcome: error

  - id: mcpdesc.elicitation.form-schema.consistency
    title: "Keep elicitation form constraints consistent"
    description: >-
      Form properties, required names, enum labels, defaults, and bounds must
      agree with one another. Correct references to absent properties and
      contradictory constraints. Passing JSON Schema's outer shape checks does
      not prove that the declared form is internally consistent.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      A form requestedSchema is internally consistent: required names declared
      properties, enumNames match enum values, defaults lie within enums, and
      minimum bounds do not exceed maximum bounds.
    surface: Elicitation Declaration
    path: requestedSchema
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 12.3
        locations:
          - sections/12-elicitation.md#req-elicitation-form-required
          - sections/12-elicitation.md#req-elicitation-form-enum-names
          - sections/12-elicitation.md#req-elicitation-form-defaults
          - sections/12-elicitation.md#req-elicitation-form-ranges
    sources:
      - tier: 1
        reference: MCP 2025-06-18 to 2026-07-28 schema.ts, PrimitiveSchemaDefinition and EnumSchema (enumNames are display names for enum values)
        locations:
          - validation/mcp-schemas/2025-06-18/schema.ts#L1479-L1486
          - validation/mcp-schemas/2025-11-25/schema.ts#L2228-L2235
          - validation/mcp-schemas/2026-07-28/schema.ts#L2861-L2868
          - validation/mcp-schemas/2025-06-18/schema.ts#L1527-L1536
          - validation/mcp-schemas/2025-11-25/schema.ts#L2463-L2464
          - validation/mcp-schemas/2026-07-28/schema.ts#L3117-L3118
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/elicitation-form-semantics.json
        pointer: /prompts/0/elicitations/0/requestedSchema/required
        outcome: error
      - path: expected-invalid/elicitation-form-invalid-range.json
        pointer: /prompts/0/elicitations/0/requestedSchema/properties/count
        outcome: error
      - path: expected-valid/elicitation-declarations.json
        pointer: /tools/0/elicitations
        outcome: passes

  - id: mcpdesc.elicitation.name-unique
    title: "Give each elicitation declaration a unique name"
    description: >-
      Elicitation declaration names identify interactions within their
      primitive. Duplicate names make a Tool interaction's declaration
      reference ambiguous. Rename one declaration and update the references
      that are intended to select it.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: Elicitation Declaration names are unique within their primitive.
    surface: Elicitation Declaration
    path: name
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 12.2
        locations:
          - sections/12-elicitation.md#req-elicitation-name-unique
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/elicitation-form-semantics.json
        pointer: /prompts/0/elicitations/1
        outcome: error

  - id: mcpdesc.elicitation.members
    title: "Declare elicitations with their mode fields"
    description: >-
      An elicitation declaration has a name, a mode, and a message. Form mode
      requires requestedSchema and forbids url; URL mode requires url and forbids
      requestedSchema. Unknown properties are rejected.
    owner: mcpdesc
    summary: >-
      An Elicitation Declaration has its required fields, the fields of its
      mode only, and no unknown properties.
    surface: Elicitation Declaration
    kind: structural
    documentSchema:
      - "#/$defs/elicitationDeclaration"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Section 12.2
        locations:
          - sections/12-elicitation.md#req-elicitation-declaration-fields
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/component-contextual-schemas.json
        pointer: "/tools/0/elicitations/0/requestedSchema/$componentRef"
        outcome: error
      - path: expected-invalid/elicitation-branch-mixing.json
        pointer: "/resources/0/elicitations/0"
        outcome: error

  - id: mcp.elicitation.form-schema.members
    title: "Use MCP primitive schemas in elicitation forms"
    description: >-
      A form-mode requestedSchema is a flat object whose properties are MCP
      primitive schemas: string, number, integer, boolean, or enumeration, with
      only the keywords MCP defines for them.
    owner: mcp
    summary: >-
      requestedSchema is an object schema of MCP primitive property schemas with
      their defined keywords only.
    surface: ElicitRequest requestedSchema
    kind: structural
    documentSchema:
      - "#/$defs/elicitationFormSchema"
      - "#/$defs/elicitationFormProperty"
      - "#/$defs/elicitationFormOption"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Section 12.3
        locations:
          - sections/12-elicitation.md#req-elicitation-form-shape
    sources:
      - tier: 1
        reference: "MCP 2025-11-25 and 2026-07-28 schema.ts, ElicitRequestFormParams and PrimitiveSchemaDefinition"
        locations:
          - validation/mcp-schemas/2025-11-25/schema.ts#L2155-L2178
          - validation/mcp-schemas/2025-11-25/schema.ts#L2234-L2235
          - validation/mcp-schemas/2026-07-28/schema.ts#L2788-L2811
          - validation/mcp-schemas/2026-07-28/schema.ts#L2867-L2868
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/component-contextual-schemas.json
        pointer: "/tools/0/elicitations/0/requestedSchema"
        outcome: error

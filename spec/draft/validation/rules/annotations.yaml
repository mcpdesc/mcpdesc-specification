rules:
  - id: mcp.tool-annotations.members
    title: "Tool annotations contain only MCP hints"
    description: >-
      Tool annotations are a closed set of behavior hints. Resource annotation
      fields such as audience and priority do not belong here, and custom keys
      are not allowed. Remove those properties; author-reviewed server
      metadata can instead use the Tool's _meta where the protocol version
      defines it.
    owner: mcp
    summary: >-
      A Tool annotations object contains only title, readOnlyHint,
      destructiveHint, idempotentHint, and openWorldHint.
    surface: ToolAnnotations
    kind: structural
    documentSchema:
      - "#/$defs/toolAnnotations"
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": not-applicable
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 9.6
        locations:
          - sections/09-tools.md#req-tool-annotations-closed
          - sections/09-tools.md#req-tool-annotations-fields
    sources:
      - tier: 1
        reference: MCP 2025-03-26 to 2026-07-28 schema.ts, interface ToolAnnotations (no index signature)
        locations:
          - validation/mcp-schemas/2025-03-26/schema.ts#L727-L779
          - validation/mcp-schemas/2025-06-18/schema.ts#L869-L923
          - validation/mcp-schemas/2025-11-25/schema.ts#L1168-L1222
          - validation/mcp-schemas/2026-07-28/schema.ts#L1900-L1954
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/tool-annotations-unknown-property.json
        pointer: /tools/0/annotations
        outcome: error
      - path: expected-valid/distinct-tool-and-resource-annotations.json
        pointer: /tools/0/annotations
        outcome: passes
    notes: >-
      Tool annotations are not available in MCP 2024-11-05; that boundary is
      checked separately.

  - id: mcp.annotations.members
    title: "Resource annotations contain only MCP hints"
    description: >-
      Resource annotations describe audience, priority, and modification time,
      not Tool behavior. Unknown properties are invalid even when their names
      start with x-. Remove those properties and keep Tool-specific hints on
      Tool annotations instead.
    owner: mcp
    summary: >-
      Resource Annotations on resources, resource templates, and content
      blocks contain only audience, priority, and lastModified.
    surface: Annotations
    kind: structural
    documentSchema:
      - "#/$defs/resourceAnnotations"
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 10.3
        locations:
          - sections/10-resources.md#req-resource-annotations-closed
          - sections/10-resources.md#req-content-annotations-distinct
    sources:
      - tier: 1
        reference: MCP 2024-11-05 schema.ts, inline annotations on Resource, ResourceTemplate, and content types; MCP 2025-03-26 to 2026-07-28 schema.ts, interface Annotations (no index signature)
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L815-L840
          - validation/mcp-schemas/2025-03-26/schema.ts#L921-L944
          - validation/mcp-schemas/2025-06-18/schema.ts#L1093-L1128
          - validation/mcp-schemas/2025-11-25/schema.ts#L1700-L1735
          - validation/mcp-schemas/2026-07-28/schema.ts#L2265-L2300
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/resource-annotations-unknown-property.json
        pointer: /resources/0/annotations
        outcome: error
      - path: expected-invalid/content-annotations-unknown-property.json
        pointer: /tools/0/examples/basic/result/content/0/annotations
        outcome: error
      - path: expected-valid/distinct-tool-and-resource-annotations.json
        pointer: /resources/0/annotations
        outcome: passes
    notes: >-
      lastModified is defined from MCP 2025-06-18; that boundary is checked
      separately.

  - id: mcp.annotations.last-modified.revision-availability
    title: "Use lastModified only where MCP defines it"
    description: >-
      Resource annotations exist in early MCP protocol versions, but
      lastModified was added in 2025-06-18. If a declaration covers an earlier
      version, omit lastModified or describe separate variants with disjoint
      scopes.
    owner: mcp
    summary: >-
      Resource Annotations carry lastModified only from MCP 2025-06-18, on
      declarations and on content blocks.
    surface: Annotations
    path: lastModified
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 10.3
        locations:
          - sections/10-resources.md#req-resource-annotations-last-modified
    sources:
      - tier: 1
        reference: MCP 2024-11-05 and 2025-03-26 schema.ts, annotations (audience, priority); MCP 2025-06-18 to 2026-07-28 schema.ts, interface Annotations (adds lastModified)
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L815-L840
          - validation/mcp-schemas/2025-03-26/schema.ts#L921-L944
          - validation/mcp-schemas/2025-06-18/schema.ts#L1093-L1128
          - validation/mcp-schemas/2025-11-25/schema.ts#L1700-L1735
          - validation/mcp-schemas/2026-07-28/schema.ts#L2265-L2300
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/annotations-last-modified-before-2025-06-18.json
        pointer: /resources/0/annotations
        outcome: error

  - id: mcp.icon.members
    title: "Use MCP Icon objects for icons"
    description: >-
      An icons array is non-empty, and each Icon has a src and only the MCP Icon
      properties mimeType, sizes, and theme, with theme light or dark.
    owner: mcp
    summary: >-
      icons is a non-empty array of MCP Icon objects with a src and only the
      properties MCP defines.
    surface: Icon
    kind: structural
    documentSchema:
      - "#/$defs/icons"
      - "#/$defs/icon"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Appendix A
        locations:
          - sections/99-appendices.md#req-icon-fields
    sources:
      - tier: 1
        reference: "MCP 2025-11-25 and 2026-07-28 schema.ts, interface Icon"
        locations:
          - validation/mcp-schemas/2025-11-25/schema.ts#L464-L501
          - validation/mcp-schemas/2026-07-28/schema.ts#L890-L927
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/empty-ordinary-nested-collections.json
        pointer: "/info/icons"
        outcome: error

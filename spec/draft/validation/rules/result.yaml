rules:
  - id: mcp.result.additional-properties.preserve
    owner: mcp
    summary: >-
      A carried MCP result may contain properties its revision does not define;
      they are preserved without assigned semantics.
    surface: Result
    kind: preservation
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: "MCP 2024-11-05 to 2026-07-28 schema.ts, interface Result (index signature [key: string]: unknown, inherited by every result type)"
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.3 (completed Tool Result shape)
    diagnostics: []
    enforcement: internal
    status: internal
    fixtures:
      - expected-valid/open-result-unknown-properties.json
    notes: >-
      Planned outcome (Examples fail fast, validation README): undefined fields
      are accepted with a warning attributed to the revision.
    gaps:
      - revisions: ["2025-06-18", "2025-11-25", "2026-07-28"]
        behavior: >-
          Fields not defined by the revision are accepted without a warning,
          except that resultType before 2026-07-28, and ttlMs and cacheScope in
          Resource examples before 2026-07-28, are rejected as errors.
        resolution: planned
        reference: Openness proposal under issue #72
      - revisions: ["2024-11-05", "2025-03-26"]
        behavior: >-
          Same as above; in addition, undefined structuredContent is rejected
          as an error.
        resolution: not-fixed

rules:
  - id: mcpdesc.tool.interaction.elicitation-consistency
    title: "Match elicitation steps to their declaration"
    description: >-
      A Tool's elicitation step must agree with the named elicitation
      declaration and its requested form. Accepted form content must satisfy
      that schema, while declined or cancelled responses have different
      content rules. Check the reference, request, and response together.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      An elicitation step matches the Tool's named Elicitation Declaration, and
      its response content is present exactly when an accepted form response
      requires it and validates against the requested schema.
    surface: Tool interaction example
    path: steps
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 9.4
        locations:
          - sections/09-tools.md#req-interaction-elicitation-declaration
          - sections/09-tools.md#req-interaction-elicitation-response
    sources:
      - tier: 1
        reference: MCP 2025-06-18 to 2026-07-28 schema.ts, interface ElicitResult, content (present for accepted form responses)
        locations:
          - validation/mcp-schemas/2025-06-18/schema.ts#L1538-L1557
          - validation/mcp-schemas/2025-11-25/schema.ts#L2466-L2486
          - validation/mcp-schemas/2026-07-28/schema.ts#L3120-L3149
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-tool-interaction-example-semantics.json
        pointer: /tools/0/interactionExamples/broken/steps/0
        outcome: error
      - path: expected-valid/named-tool-interaction-examples.json
        pointer: /tools/0/interactionExamples
        outcome: passes

  - id: mcpdesc.tool.interaction.client-requirements-consistency
    title: "Keep interactions consistent with client requirements"
    description: >-
      A Tool interaction example can contradict its explicit minimum client
      requirements. Review the warning against the scenario and the declared
      requirements. The example does not automatically create or strengthen a
      client requirement.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      Interaction steps do not contradict the Tool's explicit client capability
      requirements.
    surface: Tool interaction example
    path: steps
    kind: mcpdesc-semantic
    requirement: should
    specification:
      - reference: MCP Description 0.9.0, Sections 8.5 and 9.4
        locations:
          - sections/09-tools.md#req-interaction-client-requirements-warning
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-warning/tool-interaction-client-requirements-contradictions.json
        pointer: /tools/0/interactionExamples/contradictory/steps/0
        outcome: warning
    notes: Steps never create requirements; the warning reports a contradiction only.

  - id: mcp.sampling.tools.revision-availability
    title: "Use sampling tools only where supported"
    description: >-
      Sampling tools and toolChoice are available from MCP 2025-11-25.
      Earlier-version interaction examples cannot use those fields. Remove
      them or narrow the containing Tool's protocol scope to versions that
      support them.
    owner: mcp
    summary: >-
      A sampling request uses tools and toolChoice only from MCP 2025-11-25.
    surface: CreateMessageRequest
    path: tools, toolChoice
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 9.4
        locations:
          - sections/09-tools.md#req-interaction-sampling-revision
    sources:
      - tier: 1
        reference: MCP 2025-06-18 schema.ts, CreateMessageRequest (no tools); MCP 2025-11-25 and 2026-07-28 schema.ts, CreateMessageRequestParams tools and toolChoice
        locations:
          - validation/mcp-schemas/2025-06-18/schema.ts#L1028-L1065
          - validation/mcp-schemas/2025-11-25/schema.ts#L1573-L1622
          - validation/mcp-schemas/2026-07-28/schema.ts#L2086-L2152
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-tool-interaction-example-semantics.json
        pointer: /tools/0/interactionExamples/broken/steps/2/request
        outcome: error

  - id: mcp.root.uri.file-scheme
    title: "Use file URIs for roots"
    description: >-
      Root entries in interaction responses use file:// URIs. An arbitrary
      resource URI is not a valid root merely because the resource is
      accessible to the server. Correct the root URI without fetching or
      probing the referenced filesystem location.
    owner: mcp
    summary: A root URI in a roots response starts with file://.
    surface: Root
    path: uri
    kind: semantic
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Section 9.4
        locations:
          - sections/09-tools.md#req-interaction-revision-valid
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface Root, uri ("This *must* start with file:// for now")
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L1045-L1052
          - validation/mcp-schemas/2025-03-26/schema.ts#L1186-L1193
          - validation/mcp-schemas/2025-06-18/schema.ts#L1421-L1428
          - validation/mcp-schemas/2025-11-25/schema.ts#L2117-L2124
          - validation/mcp-schemas/2026-07-28/schema.ts#L2759-L2766
      - tier: 1
        reference: MCP 2026-07-28 specification, Client Features, Roots, Data Types (uri MUST be a file:// URI)
        locations:
          - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/dae694f61a31f7a3ec2af3aff709e11f70f61e48/docs/specification/2026-07-28/client/roots.mdx#L100-L102
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-tool-interaction-example-semantics.json
        pointer: /tools/0/interactionExamples/broken/steps/3/response/roots/0
        outcome: error

  - id: mcpdesc.tool.interaction.members
    title: "Shape Tool interaction examples and steps"
    description: >-
      A Tool interaction example has input, ordered steps, and a result. Each
      step is an elicitation, sampling, or roots step with its request and
      response, and accepts only its defined properties.
    owner: mcpdesc
    summary: >-
      Interaction examples and steps have their required members, a known step
      type, and no unknown properties.
    surface: Tool interaction example
    kind: structural
    documentSchema:
      - "#/$defs/toolInteractionExamples"
      - "#/$defs/toolInteractionExample"
      - "#/$defs/toolInteractionStep"
      - "#/$defs/toolInteractionElicitationStep"
      - "#/$defs/toolInteractionSamplingStep"
      - "#/$defs/toolInteractionRootsStep"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Section 9.4
        locations:
          - sections/09-tools.md#req-interaction-example-fields
          - sections/09-tools.md#req-interaction-step-fields
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/malformed-sampling-step.json
        pointer: "/tools/0/interactionExamples/summary/steps/0/request"
        outcome: error
      - path: expected-invalid/malformed-tool-interaction-examples.json
        pointer: "/tools/0/interactionExamples/broken/description"
        outcome: error

  - id: mcp.interaction-message.members
    title: "Use MCP shapes in interaction requests and responses"
    description: >-
      Interaction steps carry MCP values: elicitation requests and results,
      sampling requests, messages, and results, and roots lists. Each has the
      members its MCP type requires and defines.
    owner: mcp
    summary: >-
      Elicitation, sampling, and roots requests and responses in interaction
      steps have the members and member types of their MCP types.
    surface: ElicitRequest, ElicitResult, CreateMessageRequest, CreateMessageResult, ListRootsResult, Root
    kind: structural
    documentSchema:
      - "#/$defs/elicitationInteractionRequest"
      - "#/$defs/elicitationInteractionFormRequest"
      - "#/$defs/elicitationInteractionUrlRequest"
      - "#/$defs/elicitationInteractionResponse"
      - "#/$defs/elicitationInteractionAcceptedResponse"
      - "#/$defs/elicitationInteractionDeclinedResponse"
      - "#/$defs/samplingCreateMessageRequest"
      - "#/$defs/samplingCreateMessageResult"
      - "#/$defs/samplingMessage"
      - "#/$defs/samplingMessageContent"
      - "#/$defs/samplingContentBlock"
      - "#/$defs/samplingModelHint"
      - "#/$defs/samplingModelPreferences"
      - "#/$defs/samplingRequestTool"
      - "#/$defs/samplingToolChoice"
      - "#/$defs/samplingToolResultContent"
      - "#/$defs/samplingToolUseContent"
      - "#/$defs/rootsListRequest"
      - "#/$defs/rootsListResult"
      - "#/$defs/rootDeclaration"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Sections 3.6 and 9.4
        locations:
          - sections/03-document-structure.md#req-carried-defined-fields
          - sections/09-tools.md#req-interaction-revision-valid
    sources:
      - tier: 1
        reference: "MCP 2025-11-25 and 2026-07-28 schema.ts, CreateMessageRequestParams, SamplingMessage, CreateMessageResult, ElicitRequestFormParams, ElicitResult, ListRootsResult, and Root"
        locations:
          - validation/mcp-schemas/2025-11-25/schema.ts#L1578-L1622
          - validation/mcp-schemas/2025-11-25/schema.ts#L1681-L1688
          - validation/mcp-schemas/2025-11-25/schema.ts#L1656-L1674
          - validation/mcp-schemas/2025-11-25/schema.ts#L2155-L2178
          - validation/mcp-schemas/2025-11-25/schema.ts#L2471-L2486
          - validation/mcp-schemas/2025-11-25/schema.ts#L2107-L2109
          - validation/mcp-schemas/2025-11-25/schema.ts#L2116-L2136
          - validation/mcp-schemas/2026-07-28/schema.ts#L2104-L2152
          - validation/mcp-schemas/2026-07-28/schema.ts#L2245-L2249
          - validation/mcp-schemas/2026-07-28/schema.ts#L2210-L2228
          - validation/mcp-schemas/2026-07-28/schema.ts#L2788-L2811
          - validation/mcp-schemas/2026-07-28/schema.ts#L3134-L3149
          - validation/mcp-schemas/2026-07-28/schema.ts#L2742-L2744
          - validation/mcp-schemas/2026-07-28/schema.ts#L2758-L2775
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/malformed-sampling-step.json
        pointer: "/tools/0/interactionExamples/summary/steps/0/request"
        outcome: error

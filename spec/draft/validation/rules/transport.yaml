rules:
  - id: mcp.transport.streamable-http.revision-availability
    title: "Use Streamable HTTP only where supported"
    description: >-
      Streamable HTTP is not defined by the earliest supported MCP protocol
      version. Scope the transport to versions that define it and keep root
      protocol coverage consistent. A URL alone does not make a transport
      applicable to every protocol version.
    owner: mcp
    summary: Streamable HTTP is used only from MCP 2025-03-26.
    surface: Transport
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 6.2
        locations:
          - sections/06-transports.md#req-transport-streamable-http-revisions
    sources:
      - tier: 1
        reference: MCP 2025-03-26 specification, Basic, Transports, Streamable HTTP (replaces HTTP+SSE from 2024-11-05)
        locations:
          - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/dae694f61a31f7a3ec2af3aff709e11f70f61e48/docs/specification/2025-03-26/basic/transports.mdx#L50-L277
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/revision-inapplicable-streamable-http.json
        pointer: /transports/0
        outcome: error

  - id: mcp.transport.legacy-sse.deprecated
    title: "Review deprecated legacy SSE transports"
    description: >-
      Legacy HTTP plus SSE remains representable but is deprecated for later
      MCP protocol versions. The warning does not by itself invalidate the
      document. Review whether the server still offers that transport or
      whether the description should advertise Streamable HTTP instead.
    owner: mcp
    summary: >-
      Legacy HTTP+SSE associated with MCP 2025-03-26 or later is reported,
      because Streamable HTTP replaces it.
    surface: Transport
    kind: semantic
    requirement: should
    applicability:
      protocolVersions:
        "2024-11-05": not-applicable
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 6.2
        locations:
          - sections/06-transports.md#req-transport-legacy-sse-warning
    sources:
      - tier: 1
        reference: MCP 2025-03-26 specification, Basic, Transports, Backwards Compatibility (deprecated HTTP+SSE transport)
        locations:
          - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/dae694f61a31f7a3ec2af3aff709e11f70f61e48/docs/specification/2025-03-26/basic/transports.mdx#L250-L277
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-warning/legacy-sse-modern-revision.json
        pointer: /transports/0
        outcome: warning

  - id: mcpdesc.transports.coverage
    title: "Cover each declared protocol version with a transport"
    description: >-
      When transports are declared, every root protocol version must be
      covered by at least one transport's effective scope. An omitted
      transport scope inherits all root versions. Add appropriate coverage or
      narrow the documented protocol versions rather than leaving an
      unreachable view. Descriptions may omit transports entirely.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      Every protocol version at the root is covered by at least one transport
      when transports are declared.
    surface: Document
    path: transports
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 6.5
        locations:
          - sections/06-transports.md#req-transport-coverage
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/root-version-without-transport.json
        pointer: /protocolVersions
        outcome: error
      - path: expected-invalid/scoped-version-not-in-root.json
        pointer: /protocolVersions
        outcome: error

rules:
  - id: mcpdesc.document.schema
    title: "Match the MCP Description document schema"
    description: >-
      The document root has the required mcpdesc, info, and protocolVersions
      members, only the members of Section 3.2, and non-empty ordinary
      collections. Failures inside a root member belong to the rule that owns
      that member's schema location; this rule reports root-level failures.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      A document validates against the JSON Schema for its declared mcpdesc
      version. This rule owns the document root and generic JSON values; every
      other schema location belongs to a more specific rule.
    surface: Document
    kind: structural
    documentSchema:
      - "#"
      - "#/$defs/jsonValue"
      - "#/$defs/specificationExtensionValue"
    specification:
      - reference: MCP Description 0.9.0, Section 16.1, item 7
        locations:
          - sections/16-conformance.md#req-document-schema
          - sections/03-document-structure.md#req-root-fields
          - sections/03-document-structure.md#req-closed-objects
          - sections/09-tools.md#req-tool-input-schema-required
          - sections/03-document-structure.md#req-ordinary-collections-non-empty
          - sections/03-document-structure.md#req-ordinary-collections-omitted
          - sections/04-versioning.md#req-mcpdesc-required
          - sections/04-versioning.md#req-mcpdesc-version
          - sections/04-versioning.md#req-version-check
          - sections/05-info-object.md#req-info-required
          - sections/06-transports.md#req-transports-non-empty
          - sections/08-capabilities.md#req-capabilities-non-empty
          - sections/13-tags.md#req-tags-non-empty
          - sections/13-tags.md#req-tags-omitted
          - sections/16-conformance.md#req-conforming-document
          - sections/14-specification-extensions.md#req-extension-names
          - sections/14-specification-extensions.md#req-extension-unknown-accepted
          - sections/15-serialization.md#req-serialization-empty-collections
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/empty-ordinary-root-collections.json
        pointer: "/capabilities"
        outcome: error
      - path: expected-invalid/empty-tag-catalog-reference.json
        pointer: "/tags"
        outcome: error

  - id: mcp.declaration.field.revision-availability
    title: "Keep fields within their supported protocol scope"
    description: >-
      A declaration must be valid in every protocol version in its effective
      scope. A field introduced later cannot be shared with earlier versions
      merely because the document also declares the later version. Omit the
      field or describe disjoint scoped variants.
    owner: mcp
    summary: >-
      A declaration field is used only in revisions whose MCP type defines it:
      title and _meta from 2025-06-18, Tool annotations from 2025-03-26, icons
      and Tool schema $schema from 2025-11-25, Tool execution only in
      2025-11-25, and the completions capability from 2025-03-26.
    surface: Tool, Resource, ResourceTemplate, Prompt, PromptArgument, ServerCapabilities
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Sections 8.2, 9.1, 9.2, 10.1, 10.2, and 11.1
        locations:
          - sections/04-versioning.md#req-field-revision-availability
          - sections/09-tools.md#req-tool-schema-dialect-keyword
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interfaces BaseMetadata, Icons, Tool, Resource, ResourceTemplate, Prompt, PromptArgument, and ServerCapabilities
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L684-L704
          - validation/mcp-schemas/2025-03-26/schema.ts#L781-L810
          - validation/mcp-schemas/2025-06-18/schema.ts#L925-L968
          - validation/mcp-schemas/2025-11-25/schema.ts#L1244-L1297
          - validation/mcp-schemas/2026-07-28/schema.ts#L1956-L2015
          - validation/mcp-schemas/2025-06-18/schema.ts#L304-L324
          - validation/mcp-schemas/2025-11-25/schema.ts#L523-L543

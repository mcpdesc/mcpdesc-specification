rules:
  - id: mcpdesc.document.schema
    owner: mcpdesc
    summary: >-
      A document validates against the JSON Schema for its declared mcpdesc
      version. Used for structural failures not attributed to a more specific
      rule.
    surface: Document
    kind: structural
    sources:
      - tier: 8
        reference: MCP Description 0.9.0, Section 16.1, item 7
    diagnostics:
      - code: schema-validation
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/missing-tool-input-schema.json
      - expected-invalid/object-level-unknown-property.json

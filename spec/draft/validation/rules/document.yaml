  - id: mcpdesc.protocol-scope.consistency
    title: "Keep protocol scopes consistent and disjoint"
    description: >-
      An omitted scope inherits its parent's full scope; an explicit child
      scope must stay within it. Declarations with the same identity cannot
      overlap where the specification requires uniqueness. Narrow the scopes
      rather than expecting the validator to choose one variant.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      Nested protocol scopes stay within their parent scope, and same-named
      primitives and capability objects do not overlap in protocol scope.
    surface: Document
    path: protocolVersions
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Sections 4.10 and 8.6
        locations:
          - sections/04-versioning.md#req-scope-subset
          - sections/08-capabilities.md#req-capability-scopes-disjoint
          - sections/09-tools.md#req-tool-names-disjoint
          - sections/12-elicitation.md#req-elicitation-scope
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/elicitation-scope-outside-parent.json
        pointer: /resourceTemplates/0/elicitations/0
        outcome: error
      - path: expected-invalid/scoped-version-not-in-root.json
        pointer: /transports/0
        outcome: error
      - path: expected-invalid/overlapping-tool-scope.json
        pointer: /tools/1
        outcome: error
      - path: expected-invalid/overlapping-capabilities.json
        pointer: /capabilities/0
        outcome: error

  - id: mcpdesc.tags.references
    title: "Reference unique declared tags"
    description: >-
      When the document declares a tag catalogue, primitive tag references
      must name entries in it. Root tag names and repeated primitive
      references are checked for duplicates. Fix the name or catalogue entry
      instead of relying on an undeclared alias.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: Root tag names are unique, and primitives reference only declared tags.
    surface: Tag
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Sections 13.2 and 13.3
        locations:
          - sections/13-tags.md#req-tags-unique
          - sections/13-tags.md#req-tags-references
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/duplicate-root-tag.json
        pointer: /tags/1
        outcome: error
      - path: expected-invalid/duplicate-tag-reference.json
        pointer: /tools/0/tags
        outcome: error

  - id: mcpdesc.security.requirements
    title: "Reference security schemes and scopes correctly"
    description: >-
      Security requirements refer to named schemes, and scopes have meaning
      only for OAuth 2.0 or OpenID Connect schemes. Correct missing references
      or repeated scopes. An uncatalogued scope can produce a warning where
      the scheme declares a static scope catalogue.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      Security requirements name declared schemes, list scopes only for OAuth
      2.0 and OpenID Connect schemes, do not repeat scopes, and use catalogued
      scopes when the scheme declares a static catalogue.
    surface: Security Requirement
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Sections 7.1 to 7.3
        locations:
          - sections/07-security.md#req-security-scheme-references
          - sections/07-security.md#req-security-scopes-unique
          - sections/07-security.md#req-security-scopes-oauth-only
          - sections/07-security.md#req-security-uncatalogued-scope
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/unknown-security-reference.json
        pointer: /security/0
        outcome: error
      - path: expected-invalid/non-oauth-scopes.json
        pointer: /security/0
        outcome: error
      - path: expected-invalid/duplicate-security-scope.json
        pointer: /security/0
        outcome: error
      - path: expected-warning/uncatalogued-oauth-scope.json
        pointer: /tools/0/security/0/oauth
        outcome: warning
      - path: expected-warning/uncatalogued-openid-scope.json
        pointer: /security/0/oidc
        outcome: warning
    notes: >-
      The document schema rejects duplicate scopes first; the semantic
      duplicate-scope check applies only to direct callers of the semantic
      validator.

  - id: mcpdesc.components.references
    title: "Resolve component references in the right namespace"
    description: >-
      A component reference must identify an existing value in the namespace
      required by its use site, without a reference cycle. Check both the
      target name and the namespace. Reuse does not exempt the resolved value
      from validation in its containing declaration.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      A Reference Object targets an existing component in the namespace its
      use site requires, without cycles.
    surface: Reference Object
    path: $componentRef
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Sections 17.2 to 17.4
        locations:
          - sections/17-components.md#req-component-reference-form
          - sections/17-components.md#req-component-reference-resolution
          - sections/09-tools.md#req-tool-schema-references-resolved
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/component-reference-resolution.json
        pointer: /components/schemas
        outcome: error

  - id: mcpdesc.legacy-revisions.validation-scope
    title: "Limited validation for early MCP protocol versions"
    description: >-
      MCP 2024-11-05 and 2025-03-26 receive structural and selected checks,
      not a claim of complete MCP semantic conformance. The warning describes
      a validation limitation rather than an invalid document. Adding a later
      protocol version does not make checks for the earlier versions complete.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": not-applicable
        "2025-11-25": not-applicable
        "2026-07-28": not-applicable
    owner: mcpdesc
    summary: >-
      A document applying to MCP 2024-11-05 or 2025-03-26 is reported as
      receiving structural and selected checks only, not complete MCP semantic
      conformance.
    surface: Document
    path: protocolVersions
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Sections 3.5 and 16.2; Proposal 0024, Section 4.1 (revision tiers)
        locations:
          - sections/16-conformance.md#req-legacy-validation-scope
          - proposal-snapshots/0024-validation-rule-identity-and-provenance.md
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-warning/legacy-result-meta.json
        pointer: /protocolVersions
        outcome: warning

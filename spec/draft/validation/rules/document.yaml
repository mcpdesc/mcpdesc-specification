          - validation/mcp-schemas/2025-03-26/schema.ts#L442-L483
          - validation/mcp-schemas/2025-06-18/schema.ts#L521-L562
          - validation/mcp-schemas/2025-11-25/schema.ts#L797-L838
          - validation/mcp-schemas/2026-07-28/schema.ts#L1433-L1474
          - validation/mcp-schemas/2024-11-05/schema.ts#L452-L481
          - validation/mcp-schemas/2025-03-26/schema.ts#L485-L519
          - validation/mcp-schemas/2025-06-18/schema.ts#L564-L598
          - validation/mcp-schemas/2025-11-25/schema.ts#L840-L874
          - validation/mcp-schemas/2026-07-28/schema.ts#L1476-L1507
          - validation/mcp-schemas/2024-11-05/schema.ts#L558-L574
          - validation/mcp-schemas/2025-03-26/schema.ts#L596-L612
          - validation/mcp-schemas/2025-06-18/schema.ts#L696-L715
          - validation/mcp-schemas/2025-11-25/schema.ts#L979-L999
          - validation/mcp-schemas/2026-07-28/schema.ts#L1654-L1671

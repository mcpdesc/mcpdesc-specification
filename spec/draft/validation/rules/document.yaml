rules:
  - id: mcpdesc.document.schema
    title: "Match the MCP Description document schema"
    description: >-
      The structural schema checks required fields, types, allowed members,
      and collection shapes. Use the diagnostic path to locate the invalid
      value. Passing this check is necessary but does not replace semantic
      checks such as reference resolution or protocol scoping.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      A document validates against the JSON Schema for its declared mcpdesc
      version. Used for structural failures not attributed to a more specific
      rule.
    surface: Document
    kind: structural
    specification:
      - reference: MCP Description 0.9.0, Section 16.1, item 7
        locations:
          - sections/16-conformance.md#req-document-schema
          - sections/03-document-structure.md#req-closed-objects
          - sections/09-tools.md#req-tool-input-schema-required
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/missing-tool-input-schema.json
        pointer: /tools/0
        outcome: error
      - path: expected-invalid/object-level-unknown-property.json
        pointer: /tools/0
        outcome: error

  - id: mcp.declaration.field.revision-availability
    title: "Keep fields within their supported protocol scope"
    description: >-
      A declaration must be valid in every protocol version in its effective
      scope. A field introduced later cannot be shared with earlier versions
      merely because the document also declares the later version. Omit the
      field or describe disjoint scoped variants.
    owner: mcp
    summary: >-
      A declaration field is used only in revisions whose MCP type defines it:
      title and _meta from 2025-06-18, Tool annotations from 2025-03-26, icons
      and Tool schema $schema from 2025-11-25, Tool execution only in
      2025-11-25, and the completions capability from 2025-03-26.
    surface: Tool, Resource, ResourceTemplate, Prompt, PromptArgument, ServerCapabilities
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Sections 8.2, 9.1, 9.2, 10.1, 10.2, and 11.1
        locations:
          - sections/04-versioning.md#req-field-revision-availability
          - sections/09-tools.md#req-tool-schema-dialect-keyword
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interfaces BaseMetadata, Icons, Tool, Resource, ResourceTemplate, Prompt, PromptArgument, and ServerCapabilities
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L684-L704
          - validation/mcp-schemas/2025-03-26/schema.ts#L781-L810
          - validation/mcp-schemas/2025-06-18/schema.ts#L925-L968
          - validation/mcp-schemas/2025-11-25/schema.ts#L1244-L1297
          - validation/mcp-schemas/2026-07-28/schema.ts#L1956-L2015
          - validation/mcp-schemas/2025-06-18/schema.ts#L304-L324

rules:
  - id: mcp.server-capabilities.members
    title: "Advertise only recognized server capabilities"
    description: >-
      Server capabilities have defined members rather than arbitrary top-level
      names. Remove unknown members or use the experimental or extensions maps
      where the applicable protocol version allows them. MCP Description
      specification extensions follow their own x- rules.
    owner: mcp
    summary: >-
      A server Capabilities Object contains only the capabilities the
      applicable MCP revision defines; custom capabilities go in experimental
      and, from MCP 2026-07-28, in extensions.
    surface: ServerCapabilities
    kind: structural
    documentSchema:
      - "#/$defs/capabilities"
      - "#/$defs/capabilityPrompts"
      - "#/$defs/capabilityResources"
      - "#/$defs/capabilityTools"
      - "#/$defs/extensionCapabilities"
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Sections 8.2 and 8.4
        locations:
          - sections/08-capabilities.md#req-capabilities-closed
          - sections/08-capabilities.md#req-extensions-identifier-form
          - sections/14-specification-extensions.md#req-extension-ineligible-locations
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface ServerCapabilities (no index signature)
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L205-L248
          - validation/mcp-schemas/2025-03-26/schema.ts#L225-L272
          - validation/mcp-schemas/2025-06-18/schema.ts#L253-L302
          - validation/mcp-schemas/2025-11-25/schema.ts#L381-L457
          - validation/mcp-schemas/2026-07-28/schema.ts#L788-L883
      - tier: 1
        reference: 'MCP 2024-11-05 to 2026-07-28 schema.ts, ServerCapabilities doc comment ("this is not a closed set: any server can define its own, additional capabilities")'
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L205-L207
          - validation/mcp-schemas/2025-03-26/schema.ts#L225-L227
          - validation/mcp-schemas/2025-06-18/schema.ts#L253-L257
          - validation/mcp-schemas/2025-11-25/schema.ts#L381-L385
          - validation/mcp-schemas/2026-07-28/schema.ts#L788-L792
    enforcement: internal
    status: arbitrated
    fixtures:
      - path: expected-invalid/unknown-server-capability.json
        pointer: /capabilities/0
        outcome: error
      - path: expected-valid/client-capability-requirements.json
        pointer: /capabilities/0
        outcome: passes
    notes: >-
      x-* properties are MCP Description specification extensions, not
      capabilities; native projection removes them.
    arbitrations:
      - revisions: ["2024-11-05", "2025-03-26", "2025-06-18", "2025-11-25", "2026-07-28"]
        conflict: >-
          The TypeScript type declares a fixed set of members and no index
          signature, while its doc comment says the set is not closed and any
          server can define additional capabilities. The comment does not say
          where such capabilities go; experimental is the defined container.
        authority: MCP schema.ts type, the source of truth for message structures
        behavior: >-
          Reject unknown top-level members. Custom capabilities belong in
          experimental and, from MCP 2026-07-28, in extensions.
        rationale: >-
          Capabilities are sent on the wire during initialization, so the
          structural source of truth governs. Closing is also the reversible
          choice: opening the object later invalidates no document, while
          closing it later would.
        reviewTrigger: Resolution of MCP issue 1898, an upstream clarification of the doc comment, or a later MCP revision adding an index signature.
        upstream: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1898
        status: active

  - id: mcp.client-capabilities.members
    title: "Use recognized client capability requirements"
    description: >-
      A primitive's clientRequirements lists minimum client capabilities, not
      custom top-level names. Put custom requirements in experimental or in
      extensions where defined, after reviewing their meaning. Server
      capability advertisement and client requirements are different
      declarations.
    owner: mcp
    summary: >-
      A Client Capability Requirements Object names only client capabilities
      the applicable MCP revision defines; custom requirements go in
      experimental and, from MCP 2026-07-28, in extensions.
    surface: ClientCapabilities
    path: clientRequirements
    kind: structural
    documentSchema:
      - "#/$defs/clientCapabilityRequirements"
      - "#/$defs/clientCapabilityValue"
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 8.5
        locations:
          - sections/08-capabilities.md#req-client-requirements-closed
          - sections/08-capabilities.md#req-client-requirements-shape
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface ClientCapabilities (no index signature)
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L182-L203
          - validation/mcp-schemas/2025-03-26/schema.ts#L202-L223
          - validation/mcp-schemas/2025-06-18/schema.ts#L224-L251
          - validation/mcp-schemas/2025-11-25/schema.ts#L305-L379
          - validation/mcp-schemas/2026-07-28/schema.ts#L711-L786
      - tier: 1
        reference: 'MCP 2024-11-05 to 2026-07-28 schema.ts, ClientCapabilities doc comment ("this is not a closed set: any client can define its own, additional capabilities")'
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L182-L184
          - validation/mcp-schemas/2025-03-26/schema.ts#L202-L204
          - validation/mcp-schemas/2025-06-18/schema.ts#L224-L228
          - validation/mcp-schemas/2025-11-25/schema.ts#L305-L309
          - validation/mcp-schemas/2026-07-28/schema.ts#L711-L715
    enforcement: internal
    status: arbitrated
    fixtures:
      - path: expected-invalid/unknown-client-capability-requirement.json
        pointer: /tools/0/clientRequirements
        outcome: error
      - path: expected-valid/client-capability-requirements.json
        pointer: /prompts/0/clientRequirements
        outcome: passes
    arbitrations:
      - revisions: ["2024-11-05", "2025-03-26", "2025-06-18", "2025-11-25", "2026-07-28"]
        conflict: >-
          The TypeScript type declares a fixed set of members and no index
          signature, while its doc comment says the set is not closed and any
          client can define additional capabilities.
        authority: MCP schema.ts type, the source of truth for message structures
        behavior: >-
          Reject unknown top-level requirements, as for server capabilities.
          Custom requirements belong in experimental and, from MCP 2026-07-28,
          in extensions.
        rationale: >-
          Same reading as mcp.server-capabilities.members, so one document
          does not treat the two capability types differently. Closing is the
          reversible choice.
        reviewTrigger: Resolution of MCP issue 1898, an upstream clarification of the doc comment, or a later MCP revision adding an index signature.
        upstream: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1898
        status: active

  - id: mcp.client-capabilities.revision-shape
    title: "Match client requirements to the protocol version"
    description: >-
      Client capabilities and their settings change across MCP protocol
      versions. Check each declared requirement against every version in the
      primitive's effective scope. Split variants when a requirement cannot be
      represented consistently across that scope.
    owner: mcp
    summary: >-
      Each client capability requirement and nested member exists in every
      applicable revision's ClientCapabilities type, with object values and a
      boolean listChanged.
    surface: ClientCapabilities
    path: clientRequirements
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 8.5
        locations:
          - sections/08-capabilities.md#req-client-requirements-revision-valid
          - sections/08-capabilities.md#req-client-requirements-values
          - sections/08-capabilities.md#req-client-requirements-extensions
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface ClientCapabilities (members and nested members per revision)
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L182-L203
          - validation/mcp-schemas/2025-03-26/schema.ts#L202-L223
          - validation/mcp-schemas/2025-06-18/schema.ts#L224-L251
          - validation/mcp-schemas/2025-11-25/schema.ts#L305-L379
          - validation/mcp-schemas/2026-07-28/schema.ts#L711-L786
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/revision-incompatible-client-capability-requirements.json
        pointer: /tools/0/clientRequirements
        outcome: error
      - path: expected-invalid/invalid-client-requirement-value.json
        pointer: /tools/0/clientRequirements/roots
        outcome: error
      - path: expected-valid/client-capability-requirements.json
        pointer: /tools/0/clientRequirements
        outcome: passes

  - id: mcp.client-capabilities.deprecated
    title: "Review deprecated client requirements"
    description: >-
      Some client capability forms remain recognized but are deprecated in
      later MCP protocol versions. The warning does not invalidate the
      document. Review the requirement against the selected protocol version
      rather than assuming an older advertisement model still applies.
    owner: mcp
    summary: >-
      A client capability requirement that the applicable revision deprecates
      is reported.
    surface: ClientCapabilities
    path: clientRequirements
    kind: semantic
    requirement: should
    applicability:
      protocolVersions:
        "2024-11-05": not-applicable
        "2025-03-26": not-applicable
        "2025-06-18": not-applicable
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 8.5
        locations:
          - sections/08-capabilities.md#req-client-requirements-deprecated
    sources:
      - tier: 1
        reference: MCP 2025-11-25 schema.ts, CreateMessageRequest includeContext ("thisServer" and "allServers" are soft-deprecated; tied to ClientCapabilities.sampling.context)
        locations:
          - validation/mcp-schemas/2025-11-25/schema.ts#L1588-L1595
      - tier: 1
        reference: MCP 2026-07-28 schema.ts, ClientCapabilities roots and sampling (@deprecated, SEP-2577)
        locations:
          - validation/mcp-schemas/2026-07-28/schema.ts#L732-L732
          - validation/mcp-schemas/2026-07-28/schema.ts#L733-L759
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-warning/deprecated-client-capability-requirements.json
        pointer: /prompts/0/clientRequirements
        outcome: warning

  - id: mcp.capabilities.extensions.revision-availability
    title: "Recognize pre-standard extension advertisements"
    description: >-
      MCP Description accepts server extension advertisements before their
      standardization, with a warning for the affected protocol versions. The
      values are preserved rather than rewritten. This exception does not make
      primitive clientRequirements.extensions available in those earlier
      versions.
    owner: mcp
    summary: >-
      Server capabilities.extensions is defined from MCP 2026-07-28; for
      earlier revisions a pre-standard extensions map is preserved with a
      warning.
    surface: ServerCapabilities
    path: extensions
    kind: structural
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 8.4; Proposal 0021 (pre-standard extension capabilities)
        locations:
          - sections/08-capabilities.md#req-capabilities-extensions-pre-standard
          - ../../proposals/0021-pre-standard-extension-capabilities.md
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2025-11-25 schema.ts, interface ServerCapabilities (no extensions); MCP 2026-07-28 schema.ts, ServerCapabilities extensions
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L205-L248
          - validation/mcp-schemas/2025-03-26/schema.ts#L225-L272
          - validation/mcp-schemas/2025-06-18/schema.ts#L253-L302
          - validation/mcp-schemas/2025-11-25/schema.ts#L381-L457
          - validation/mcp-schemas/2026-07-28/schema.ts#L871-L882
    enforcement: internal
    status: arbitrated
    fixtures:
      - path: expected-warning/pre-standard-extension-capabilities.json
        pointer: /capabilities/0
        outcome: warning
    arbitrations:
      - revisions: ["2024-11-05", "2025-03-26", "2025-06-18", "2025-11-25"]
        conflict: >-
          ServerCapabilities is closed and has no extensions member before MCP
          2026-07-28, so mcp.server-capabilities.members would reject it, but
          deployed servers advertise extensions with a pre-standard convention.
        authority: MCP Description decision (Proposal 0021)
        behavior: >-
          Accept and preserve a server extensions map for earlier revisions
          with a warning; client requirements stay revision-strict.
        rationale: >-
          Rejecting it would make descriptions of deployed servers inaccurate.
          The warning keeps the departure from the type visible.
        reviewTrigger: Retirement of the pre-standard convention, or a decision to drop support for it.
        status: active

  - id: mcpdesc.extensions.catalogue-maturity
    title: "Review reserved extension identifiers"
    description: >-
      Extension identifiers in an MCP-reserved namespace are checked against
      the pinned catalogue. Unknown or experimental identifiers are preserved
      with a warning. Verify the identifier and its maturity; an unrecognized
      identifier is not silently assigned known extension semantics.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      An extension identifier under an MCP-reserved prefix that the pinned
      extension catalogue lists as experimental, or does not list, is preserved
      with a warning.
    surface: Extension identifier
    path: capabilities.extensions, clientRequirements.extensions
    kind: mcpdesc-semantic
    requirement: should
    specification:
      - reference: MCP Description 0.9.0, Sections 8.4 and 8.5; validator extension catalogue (effective 2026-09-04)
        locations:
          - sections/08-capabilities.md#req-extensions-reserved-identifiers
          - sections/08-capabilities.md#req-extensions-catalogue-maturity
          - sections/08-capabilities.md#req-extensions-official-no-warning
    sources:
      - tier: 1
        reference: MCP 2026-07-28 specification, Basic, General fields, _meta key name format (second label modelcontextprotocol or mcp is reserved)
        locations:
          - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/dae694f61a31f7a3ec2af3aff709e11f70f61e48/docs/specification/2026-07-28/basic/index.mdx#L337-L339
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-warning/unknown-reserved-extension-identifier.json
        pointer: /capabilities/0/extensions
        outcome: warning
      - path: expected-warning/deprecated-client-capability-requirements.json
        pointer: /prompts/0/clientRequirements/extensions
        outcome: warning
    notes: >-
      The pinned catalogue lists no experimental identifiers, so no document
      currently produces the experimental-identifier warning.

  - id: mcp.capabilities.tasks.revision-availability
    title: "Keep task capabilities in their protocol version"
    description: >-
      Task capabilities from MCP 2025-11-25 and extension advertisements in
      MCP 2026-07-28 are not interchangeable fields. Limit each capability
      declaration to the versions that define it. The validator does not
      automatically translate a tasks object into an extension advertisement.
    owner: mcp
    summary: >-
      The core tasks server capability exists only in MCP 2025-11-25; MCP
      2026-07-28 uses the tasks extension instead.
    surface: ServerCapabilities
    path: tasks
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 8.3
        locations:
          - sections/08-capabilities.md#req-capabilities-tasks-distinct
          - sections/04-versioning.md#req-field-revision-availability
    sources:
      - tier: 1
        reference: MCP 2025-11-25 schema.ts, ServerCapabilities tasks; MCP 2025-06-18 and 2026-07-28 schema.ts, ServerCapabilities (no tasks)
        locations:
          - validation/mcp-schemas/2025-11-25/schema.ts#L430-L456
          - validation/mcp-schemas/2025-06-18/schema.ts#L253-L302
          - validation/mcp-schemas/2026-07-28/schema.ts#L788-L883
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/tasks-capability-2026.json
        pointer: /capabilities/0
        outcome: error

  - id: mcp.capabilities.logging.deprecated
    title: "Review the deprecated logging capability"
    description: >-
      MCP 2026-07-28 uses per-request log-level selection rather than
      logging/setLevel. MCP Description warns about the logging server
      capability for that version. Review the advertisement; the warning alone
      does not make the description invalid.
    owner: mcp
    summary: The logging server capability is reported as deprecated in MCP 2026-07-28.
    surface: ServerCapabilities
    path: logging
    kind: semantic
    requirement: should
    applicability:
      protocolVersions:
        "2024-11-05": not-applicable
        "2025-03-26": not-applicable
        "2025-06-18": not-applicable
        "2025-11-25": not-applicable
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Section 8.2
        locations:
          - sections/08-capabilities.md#req-capabilities-logging-deprecated
    sources:
      - tier: 1
        reference: MCP 2026-07-28 schema.ts, ServerCapabilities logging (@deprecated, SEP-2577); specification, Server Features, Utilities, Logging (deprecated)
        locations:
          - validation/mcp-schemas/2026-07-28/schema.ts#L798-L808
          - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/dae694f61a31f7a3ec2af3aff709e11f70f61e48/docs/specification/2026-07-28/server/utilities/logging.mdx#L8-L18
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-warning/logging-deprecated-2026.json
        pointer: /capabilities/0
        outcome: warning

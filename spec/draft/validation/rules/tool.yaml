rules:
  - id: mcp.tool.output-schema.revision-availability
    owner: mcp
    summary: A Tool declares outputSchema only for MCP revisions whose Tool type defines it.
    surface: Tool
    path: outputSchema
    kind: structural
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": not-applicable
      "2025-11-25": not-applicable
      "2026-07-28": not-applicable
    sources:
      - tier: 1
        reference: MCP 2025-03-26 schema.ts, interface Tool (closed; no outputSchema)
      - tier: 1
        reference: MCP 2025-06-18 schema.ts, interface Tool, outputSchema
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.1 (Tool Object field table)
    diagnostics:
      - code: field-not-supported-by-version
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/output-schema-before-2025-06-18.json

  - id: mcp.tool.output-schema.object-root
    owner: mcp
    summary: A Tool outputSchema has an object-typed root.
    surface: Tool
    path: outputSchema
    kind: structural
    applicability:
      "2024-11-05": not-applicable
      "2025-03-26": not-applicable
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": not-applicable
    sources:
      - tier: 1
        reference: MCP 2025-06-18 and 2025-11-25 schema.ts, interface Tool, outputSchema (type "object")
      - tier: 1
        reference: MCP 2026-07-28 schema.ts, interface Tool, outputSchema (no root type)
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.2
    diagnostics:
      - code: field-not-supported-by-version
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/non-object-output-schema-before-2026.json
      - expected-valid/protocol-coverage-and-tool-schemas.json
    gaps:
      - revisions: ["2024-11-05", "2025-03-26"]
        behavior: >-
          The object-root check also runs where outputSchema is not defined, so a
          non-object outputSchema reports this error in addition to the
          revision-availability error.
        resolution: not-fixed

  - id: mcp.tool.schema-keywords.preserve
    owner: mcp
    summary: >-
      Tool inputSchema and outputSchema are JSON Schema objects; keywords beyond
      those MCP lists are permitted and preserved, and acquire MCP semantics
      only where a revision defines them.
    surface: Tool
    path: inputSchema, outputSchema
    kind: preservation
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2025-11-25 schema.ts, interface Tool, inputSchema and outputSchema doc comments ("A JSON Schema object")
      - tier: 1
        reference: "MCP 2026-07-28 schema.ts, interface Tool, inputSchema and outputSchema (index signature [key: string]: unknown)"
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.2
    diagnostics: []
    enforcement: internal
    status: arbitrated
    fixtures:
      - expected-valid/custom-tool-schema-keywords.json
      - expected-valid/revision-inapplicable-mcp-header.json
    arbitrations:
      - revisions: ["2024-11-05", "2025-03-26", "2025-06-18", "2025-11-25"]
        conflict: >-
          The TypeScript type of inputSchema (and outputSchema from 2025-06-18)
          lists only type, properties, required, and from 2025-11-25 $schema,
          with no index signature, while its doc comment defines the value as a
          JSON Schema object.
        authority: MCP schema.ts doc comment, consistent with MCP 2026-07-28
        behavior: Accept and preserve any JSON Schema keyword in these revisions.
        rationale: >-
          A JSON Schema object admits any keyword. MCP 2026-07-28 makes this
          explicit with an index signature, and rejecting keywords such as $defs
          or $ref would reject Tools that MCP clients accept.
        reviewTrigger: An upstream clarification or erratum for the earlier revisions.
        status: active

  - id: mcp.tool.input-schema.object-root
    owner: mcp
    summary: >-
      Tool inputSchema is a JSON Schema object whose root declares
      type "object", because tool arguments are always JSON objects.
    surface: Tool
    path: inputSchema
    kind: structural
    requirement: must
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: 'MCP 2024-11-05 to 2026-07-28 schema.ts, interface Tool, inputSchema type: "object"'
      - tier: 1
        reference: MCP 2026-07-28 specification, Server Features, Tools, Data Types, Tool (inputSchema MUST be a valid JSON Schema object, not null)
      - tier: 4
        reference: MCP SEP-2106 (Final), which keeps type "object" deliberately
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.2
    diagnostics:
      - code: schema-validation
        severity: error
    enforcement: internal
    status: arbitrated
    fixtures:
      - expected-invalid/non-object-input-schema.json
      - expected-valid/custom-tool-schema-keywords.json
    arbitrations:
      - revisions: ["2025-11-25", "2026-07-28"]
        conflict: >-
          The specification lets embedded schemas declare another dialect with
          $schema, while schema.ts requires the JSON Schema keyword and value
          type "object" at the root. A schema rooted in $ref or allOf, or written
          in a dialect without that keyword, can describe an object but does not
          match the TypeScript type.
        authority: MCP schema.ts, the source of truth for message structures
        behavior: Require a literal type "object" at the inputSchema root in every revision.
        rationale: >-
          The structural source of truth is explicit and SEP-2106 retained the
          requirement on purpose; clients commonly pass inputSchema to model
          APIs that expect an object root.
        upstream: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/3238
        reviewTrigger: Resolution of MCP issue 3238 or a later MCP revision that changes the inputSchema type.
        status: active

  - id: mcp.tool.input-schema.x-mcp-header
    owner: mcp
    summary: >-
      An x-mcp-header annotation is a non-empty HTTP field-name token on a
      boolean, integer, or string property reachable from the input schema root
      through properties only, and is unique case-insensitively within the Tool.
    surface: Tool
    path: inputSchema properties x-mcp-header
    kind: semantic
    applicability:
      "2024-11-05": opaque
      "2025-03-26": opaque
      "2025-06-18": opaque
      "2025-11-25": opaque
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: MCP 2026-07-28 specification, Streamable HTTP transport, x-mcp-header validity and extraction rules
      - tier: 1
        reference: MCP 2026-07-28 schema.ts, interface Tool, inputSchema doc comment
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.2
    diagnostics:
      - code: invalid-x-mcp-header
        severity: error
      - code: duplicate-x-mcp-header
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-valid/revision-inapplicable-mcp-header.json
      - expected-valid/custom-tool-schema-keywords.json
      - expected-invalid/invalid-mcp-header-value.json
      - expected-invalid/invalid-mcp-header-placement.json
      - expected-invalid/duplicate-mcp-header.json

  - id: json-schema.tool-schema.valid
    owner: json-schema
    summary: >-
      An embedded Tool inputSchema or outputSchema is valid under its declared
      or default JSON Schema dialect, and that dialect is one the validator
      supports.
    surface: Tool
    path: inputSchema, outputSchema
    kind: embedded-standard
    requirement: must
    applicability:
      "2024-11-05": not-applicable
      "2025-03-26": not-applicable
      "2025-06-18": not-applicable
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: MCP 2025-11-25 and 2026-07-28 schema.ts, interface Tool, inputSchema and outputSchema doc comments (default JSON Schema 2020-12 when $schema is absent)
      - tier: 2
        reference: JSON Schema 2020-12 Core and Validation, and draft-07, for the declared dialect
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.2 (reject unsupported dialects; never fetch external $ref targets; warn when validation is incomplete)
    diagnostics:
      - code: invalid-tool-schema
        severity: error
      - code: unsupported-tool-schema-dialect
        severity: error
      - code: unresolved-external-tool-schema-reference
        severity: warning
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/malformed-tool-schema.json
      - expected-invalid/unresolved-local-tool-ref.json
      - expected-invalid/unsupported-tool-schema-dialect.json
      - expected-warning/unresolved-external-tool-ref.json
      - expected-warning/unresolved-external-tool-example-ref.json
    notes: >-
      The validator supports JSON Schema 2020-12 and draft-07. Earlier
      revisions define no embedded dialect; mcp.tool.schema.legacy-shape
      applies there instead.

  - id: mcp.tool.schema.legacy-shape
    owner: mcp
    summary: >-
      Before MCP 2025-11-25, Tool schema properties is an object of objects
      and required is an array of strings; other keywords are preserved.
    surface: Tool
    path: inputSchema, outputSchema
    kind: structural
    requirement: must
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": not-applicable
      "2026-07-28": not-applicable
    sources:
      - tier: 1
        reference: "MCP 2024-11-05 to 2025-06-18 schema.ts, interface Tool, inputSchema (and outputSchema from 2025-06-18): properties?: { [key: string]: object }, required?: string[]"
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.2
    diagnostics:
      - code: invalid-legacy-tool-schema-shape
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/malformed-pre-dialect-tool-schema-shape.json
    notes: >-
      From MCP 2025-11-25 the embedded dialect governs these keywords
      (json-schema.tool-schema.valid).

  - id: mcp.tool.structured-content.output-schema
    owner: mcp
    summary: >-
      When a Tool declares outputSchema, a successful result contains
      structuredContent.
    surface: CallToolResult
    path: structuredContent
    kind: semantic
    requirement: must
    applicability:
      "2024-11-05": not-applicable
      "2025-03-26": not-applicable
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: MCP 2025-06-18 to 2026-07-28 specification, Server Features, Tools, Output Schema ("Servers MUST provide structured results that conform to this schema")
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.3
    diagnostics:
      - code: missing-tool-example-structured-content
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/invalid-tool-example-result-semantics.json
      - expected-invalid/invalid-tool-interaction-example-semantics.json
    notes: >-
      Conformance of structuredContent to outputSchema is checked by
      mcpdesc.tool.example.schema-conformance. Error results are governed by
      mcpdesc.tool.example.error-result.

  - id: mcpdesc.tool.example.schema-conformance
    owner: mcpdesc
    summary: >-
      A Tool example input validates against inputSchema, and its
      structuredContent against outputSchema, for every applicable revision;
      incomplete validation is reported.
    surface: Tool example
    path: examples, interactionExamples
    kind: mcpdesc-semantic
    requirement: must
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: MCP 2025-06-18 to 2026-07-28 specification, Server Features, Tools, Output Schema (structured results conform to outputSchema)
      - tier: 8
        reference: MCP Description 0.9.0, Sections 9.2, 9.3, and 9.4
    diagnostics:
      - code: tool-example-schema-mismatch
        severity: error
      - code: incomplete-tool-example-validation
        severity: warning
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/tool-example-schema-mismatches.json
      - expected-invalid/component-contextual-examples.json
      - expected-warning/pre-dialect-tool-example.json
      - expected-warning/unresolved-external-tool-example-ref.json
    notes: >-
      Before MCP 2025-11-25 no embedded dialect is defined, so only the
      legacy shape is checked and the warning reports the gap.

  - id: mcpdesc.tool.example.error-result
    owner: mcpdesc
    summary: >-
      A Tool execution-error example result sets isError to true and does not
      contain structuredContent.
    surface: Tool example
    path: result
    kind: mcpdesc-semantic
    requirement: must
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 8
        reference: MCP Description 0.9.0, Section 9.3 (an execution-error result MUST NOT contain structuredContent; outputSchema does not validate error content)
    diagnostics:
      - code: structured-tool-error-example
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/invalid-tool-example-result-semantics.json
    notes: >-
      MCP does not forbid structuredContent on error results; MCP Description
      requires its absence so that example structuredContent always conforms
      to outputSchema.

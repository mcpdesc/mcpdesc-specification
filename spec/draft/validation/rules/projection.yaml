rules:
  - id: mcpdesc.projection.source-valid
    title: "Project a valid source and declared protocol version"
    description: >-
      Native projection first validates the source and checks that the
      requested MCP protocol version appears at the root. Fix source errors or
      select a declared version. These failures come from the projection
      operation, not a new document-validation phase.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      Native projection starts from a document without validation errors and
      from a revision in its root protocolVersions.
    surface: Native projection
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.14, steps 1 and 2
        locations:
          - sections/04-versioning.md#req-native-projection-source-valid
          - sections/04-versioning.md#req-native-projection-revision-declared
    enforcement: external
    status: delegated
    fixtures:
      - path: projection-fixtures/tool-source-invalid.json
        pointer: /expectedError
        outcome: error
      - path: projection-fixtures/tool-revision-not-declared.json
        pointer: /expectedError
        outcome: error
      - path: projection-fixtures/prompt-revision-not-declared.json
        pointer: /expectedError
        outcome: error
    notes: >-
      Implemented by @mcpdesc/core; this repository checks the fixtures with
      scripts/test-projection-fixtures.mjs.

  - id: mcpdesc.projection.declaration-applicable
    title: "Select an applicable declaration for projection"
    description: >-
      Native projection selects a Tool, Resource, Resource Template, or Prompt
      by its identifier in one protocol view. A declaration outside that view
      cannot be projected for that version. Check the identifier and the
      declaration's inherited or explicit scope.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      Native projection selects one declaration of the requested kind and
      identifier in the Effective Protocol View of the revision.
    surface: Native projection
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.14, step 3
        locations:
          - sections/04-versioning.md#req-native-projection-declaration-applicable
    enforcement: external
    status: delegated
    fixtures:
      - path: projection-fixtures/tool-not-applicable-2024-11-05.json
        pointer: /expectedError
        outcome: error
      - path: projection-fixtures/resource-template-not-applicable-2025-03-26.json
        pointer: /expectedError
        outcome: error
    notes: >-
      Implemented by @mcpdesc/core; this repository checks the fixtures with
      scripts/test-projection-fixtures.mjs.

  - id: mcpdesc.projection.native-schema
    title: "Preserve MCP values when projecting declarations"
    description: >-
      Native projection resolves Tool schema components, removes
      description-only fields, and checks the value against the selected MCP
      schema. It does not repair values or invent defaults. A postcondition
      failure returns no projected value. It is an implementation or
      specification defect, unless validation warned about the Tool schema
      under mcp.tool.schema.native-shape for that revision.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      A native projection keeps exactly the declaration fields that the MCP
      type defines in the revision, unchanged after reference resolution, and
      the value validates against the pinned MCP schema of the revision.
    surface: Tool, Resource, ResourceTemplate, Prompt
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.14, steps 4 to 6, no synthesis, and lists
        locations:
          - sections/04-versioning.md#req-native-projection-references-resolved
          - sections/04-versioning.md#req-native-projection-fields
          - sections/04-versioning.md#req-native-projection-postcondition
          - sections/04-versioning.md#req-native-projection-no-synthesis
          - sections/04-versioning.md#req-native-projection-lists
          - sections/09-tools.md#req-tool-example-projection-omitted
          - sections/09-tools.md#req-interaction-projection-omitted
          - sections/04-versioning.md#req-native-projection-steps
          - sections/04-versioning.md#req-native-projection-no-repair
          - sections/10-resources.md#req-resource-example-projection-omitted
          - sections/10-resources.md#req-template-completion-projection-omitted
          - sections/11-prompts.md#req-prompt-example-projection-omitted
          - sections/11-prompts.md#req-prompt-completion-projection-omitted
    enforcement: external
    status: delegated
    fixtures:
      - path: projection-fixtures/tool-icons-execution-component-2025-11-25.json
        pointer: /expected
        outcome: passes
      - path: projection-fixtures/tool-component-input-array-output-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: projection-fixtures/prompt-arguments-2024-11-05.json
        pointer: /expected/arguments
        outcome: passes
      - path: projection-fixtures/tools-list-2025-11-25.json
        pointer: /expected
        outcome: passes
      - path: projection-fixtures/tool-boolean-property-schema-2026-07-28.json
        pointer: /expected/inputSchema/properties
        outcome: passes
      - path: projection-fixtures/tool-postcondition-failed-2025-11-25.json
        pointer: /expectedError
        outcome: error
      - path: projection-fixtures/tools-list-postcondition-failed-2025-11-25.json
        pointer: /expectedError
        outcome: error
      - path: projection-fixtures/tool-ref-root-postcondition-failed-2025-11-25.json
        pointer: /expectedError
        outcome: error
      - path: projection-fixtures/tool-ref-root-postcondition-failed-2026-07-28.json
        pointer: /expectedError
        outcome: error
    notes: >-
      The postcondition cases come from Tool schemas that are valid under
      their JSON Schema dialect but miss a schema-syntax restriction of the MCP
      Tool type (Proposal 0032), not from an injected fault: the source is
      valid with a warning, yet the native value fails the pinned MCP schema.
      A list fails as a whole. scripts/test-projection-fixtures.mjs checks that
      each failure case's value really fails that schema and that every
      expected value passes it.

  - id: mcpdesc.view.projection
    title: "Project a document to one protocol revision"
    description: >-
      A single-version projection validates the source, keeps the declarations
      whose effective scope includes the revision, removes their scopes, and
      keeps everything else unchanged: security forms, examples, client
      requirements, tags, extensions, and the components still referenced.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      An Effective Protocol View is a valid document for one revision that keeps
      the applicable declarations and preserves their content, security
      semantics, and referenced components.
    surface: Effective Protocol View
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.12, and the view requirements of Sections 3 to 17
        locations:
          - sections/04-versioning.md#req-view-projection
          - sections/04-versioning.md#req-view-projection-transports
          - sections/03-document-structure.md#req-security-empties-preserved
          - sections/07-security.md#req-security-empty-distinction
          - sections/07-security.md#req-security-projection
          - sections/15-serialization.md#req-serialization-empty-values-preserved
          - sections/09-tools.md#req-tool-example-views-preserved
          - sections/09-tools.md#req-interaction-views-preserved
          - sections/08-capabilities.md#req-client-requirements-views
          - sections/10-resources.md#req-resource-example-views
          - sections/10-resources.md#req-template-completion-views
          - sections/11-prompts.md#req-prompt-example-views
          - sections/11-prompts.md#req-prompt-completion-views
          - sections/13-tags.md#req-tags-views
          - sections/14-specification-extensions.md#req-extension-views
          - sections/17-components.md#req-component-pruning
    enforcement: external
    status: delegated
    fixtures:
      - path: view-fixtures/view-client-requirements-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-completion-examples-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-component-pruning-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-prompt-examples-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-protocol-scoped-primitives-2025-11-25.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-protocol-scoped-primitives-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-resource-examples-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-revision-not-declared.json
        pointer: /expectedFailure
        outcome: error
      - path: view-fixtures/view-security-forms-2025-11-25.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-security-forms-2026-07-28.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-source-invalid.json
        pointer: /expectedFailure
        outcome: error
      - path: view-fixtures/view-specification-extensions-2025-11-25.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/view-tool-interaction-examples-2025-11-25.json
        pointer: /expected
        outcome: passes
    notes: >-
      Checked by the cases in view-fixtures/, which scripts/test-view-fixtures.mjs
      recomputes with the reference operations of scripts/mcpdesc-views.mjs.
      Implementations such as @mcpdesc/core must pass them.

  - id: mcpdesc.view.merge
    title: "Merge protocol views without guessing"
    description: >-
      A merge validates every input, requires equivalent views for a shared
      revision and equal unscoped metadata, collapses equivalent declarations,
      keeps differing ones as disjoint variants, renames colliding components,
      and fails rather than guess when inputs conflict.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      A merge result is valid, preserves every input revision view, and fails
      on any conflict it cannot represent faithfully.
    surface: Effective Protocol View
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.13, and the merge requirements of Sections 13, 14, and 17
        locations:
          - sections/04-versioning.md#req-merge-inputs
          - sections/04-versioning.md#req-merge-algorithm
          - sections/04-versioning.md#req-merge-equivalence
          - sections/04-versioning.md#req-merge-security
          - sections/04-versioning.md#req-merge-collections
          - sections/13-tags.md#req-tags-merge
          - sections/14-specification-extensions.md#req-extension-merge
          - sections/17-components.md#req-component-merge
          - sections/17-components.md#req-component-merge-extensions
    enforcement: external
    status: delegated
    fixtures:
      - path: view-fixtures/merge-component-extension-conflict.json
        pointer: /expectedFailure
        outcome: error
      - path: view-fixtures/merge-component-name-collision.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/merge-invalid-input.json
        pointer: /expectedFailure
        outcome: error
      - path: view-fixtures/merge-object-extension-conflict.json
        pointer: /expectedFailure
        outcome: error
      - path: view-fixtures/merge-object-extensions-variants.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/merge-protocol-scoped-primitives.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/merge-same-revision-conflict.json
        pointer: /expectedFailure
        outcome: error
      - path: view-fixtures/merge-security-forms.json
        pointer: /expected
        outcome: passes
      - path: view-fixtures/merge-tag-catalogue-conflict.json
        pointer: /expectedFailure
        outcome: error
      - path: view-fixtures/merge-unscoped-conflict.json
        pointer: /expectedFailure
        outcome: error
    notes: >-
      Checked by the cases in view-fixtures/; scripts/test-view-fixtures.mjs also
      checks the round-trip invariant of Section 4.13 for every merge result.

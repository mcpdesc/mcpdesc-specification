rules:
  - id: mcpdesc.projection.source-valid
    title: "Project a valid source and declared protocol version"
    description: >-
      Native projection first validates the source and checks that the
      requested MCP protocol version appears at the root. Fix source errors or
      select a declared version. These failures come from the projection
      operation, not a new document-validation phase.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      Native projection starts from a document without validation errors and
      from a revision in its root protocolVersions.
    surface: Native projection
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.14, steps 1 and 2
        locations:
          - sections/04-versioning.md#req-native-projection-source-valid
          - sections/04-versioning.md#req-native-projection-revision-declared
    diagnostics:
      - code: projection-source-invalid
        severity: error
      - code: projection-revision-not-declared
        severity: error
    enforcement: external
    status: delegated
    fixtures:
      - path: projection-fixtures/tool-source-invalid.json
        pointer: /expectedError
      - path: projection-fixtures/tool-revision-not-declared.json
        pointer: /expectedError
      - path: projection-fixtures/prompt-revision-not-declared.json
        pointer: /expectedError
    notes: >-
      Implemented by @mcpdesc/core; this repository checks the fixtures with
      scripts/test-projection-fixtures.mjs.

  - id: mcpdesc.projection.declaration-applicable
    title: "Select an applicable declaration for projection"
    description: >-
      Native projection selects a Tool, Resource, Resource Template, or Prompt
      by its identifier in one protocol view. A declaration outside that view
      cannot be projected for that version. Check the identifier and the
      declaration's inherited or explicit scope.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      Native projection selects one declaration of the requested kind and
      identifier in the Effective Protocol View of the revision.
    surface: Native projection
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.14, step 3
        locations:
          - sections/04-versioning.md#req-native-projection-declaration-applicable
    diagnostics:
      - code: projection-declaration-not-applicable
        severity: error
    enforcement: external
    status: delegated
    fixtures:
      - path: projection-fixtures/tool-not-applicable-2024-11-05.json
        pointer: /expectedError
      - path: projection-fixtures/resource-template-not-applicable-2025-03-26.json
        pointer: /expectedError
    notes: >-
      Implemented by @mcpdesc/core; this repository checks the fixtures with
      scripts/test-projection-fixtures.mjs.

  - id: mcpdesc.projection.native-schema
    title: "Preserve MCP values when projecting declarations"
    description: >-
      Native projection resolves Tool schema components, removes
      description-only fields, and checks the value against the selected MCP
      schema. It does not repair values or invent defaults. A postcondition
      failure is an implementation or specification defect and returns no
      projected value.
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    owner: mcpdesc
    summary: >-
      A native projection keeps exactly the declaration fields that the MCP
      type defines in the revision, unchanged after reference resolution, and
      the value validates against the pinned MCP schema of the revision.
    surface: Tool, Resource, ResourceTemplate, Prompt
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 4.14, steps 4 to 6, no synthesis, and lists
        locations:
          - sections/04-versioning.md#req-native-projection-references-resolved
          - sections/04-versioning.md#req-native-projection-fields
          - sections/04-versioning.md#req-native-projection-postcondition
          - sections/04-versioning.md#req-native-projection-no-synthesis
          - sections/04-versioning.md#req-native-projection-lists
    diagnostics:
      - code: projection-postcondition-failed
        severity: error
    enforcement: external
    status: delegated
    fixtures:
      - path: projection-fixtures/tool-icons-execution-component-2025-11-25.json
        pointer: /expected
      - path: projection-fixtures/tool-component-input-array-output-2026-07-28.json
        pointer: /expected
      - path: projection-fixtures/prompt-arguments-2024-11-05.json
        pointer: /expected/arguments
      - path: projection-fixtures/tools-list-2025-11-25.json
        pointer: /expected
    notes: >-
      No fixture expects projection-postcondition-failed: it can only result
      from a defect in this specification, its validator, or an implementation.
      Every expected value is checked against the pinned MCP schema of its
      revision instead.

rules:
  - id: mcpdesc.prompt.example.arguments
    owner: mcpdesc
    summary: >-
      A Prompt example supplies every required Prompt argument and no
      undeclared argument.
    surface: Prompt example
    path: arguments
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 11.3
        locations:
          - sections/11-prompts.md#req-prompt-example-arguments
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface PromptArgument, required ("Whether this argument must be provided")
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L588-L591
          - validation/mcp-schemas/2025-03-26/schema.ts#L626-L629
          - validation/mcp-schemas/2025-06-18/schema.ts#L727-L730
          - validation/mcp-schemas/2025-11-25/schema.ts#L1011-L1014
          - validation/mcp-schemas/2026-07-28/schema.ts#L1683-L1686
    diagnostics:
      - code: prompt-example-missing-required-argument
        severity: error
      - code: prompt-example-unknown-argument
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-prompt-example-semantics.json
        pointer: /prompts/0/examples/unknown-and-missing/arguments
      - path: expected-invalid/component-contextual-examples.json
        pointer: /components/promptExamples/bad-arguments
      - path: expected-valid/named-prompt-examples.json
        pointer: /prompts/2

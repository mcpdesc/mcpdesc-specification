rules:
  - id: mcpdesc.example.result.revision-fidelity
    title: "Match example results to every applicable version"
    description: >-
      A completed example result must contain the fields each applicable MCP
      protocol version requires, with valid values. Check the result's full
      effective scope, not only the newest version. Fields permitted but
      undefined on open result types are handled separately as warnings.
    owner: mcpdesc
    summary: >-
      An example result contains every field that each applicable MCP revision
      requires, and every field a revision defines has a valid value.
    surface: Example result
    kind: mcpdesc-semantic
    applicability:
      protocolVersions:
        "2024-11-05": applies
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Sections 9.3, 10.4.4, 10.4.6, 11.3, and 11.4
        locations:
          - sections/03-document-structure.md#req-carried-defined-fields
          - sections/09-tools.md#req-tool-example-result-shape
          - sections/10-resources.md#req-resource-example-result-shape
          - sections/11-prompts.md#req-prompt-example-result-shape
      - reference: "Examples fail fast decision (validation README, 2026-10-25, issue #72)"
        locations:
          - validation/README.md#examples-fail-fast
    sources:
      - tier: 1
        reference: "MCP 2026-07-28 schema.ts, interface Result (resultType required) and interface CacheableResult (ttlMs, cacheScope required)"
        locations:
          - validation/mcp-schemas/2026-07-28/schema.ts#L218-L236
          - validation/mcp-schemas/2026-07-28/schema.ts#L1076-L1110
    diagnostics:
      - code: tool-example-result-version-mismatch
        severity: error
      - code: resource-example-result-version-mismatch
        severity: error
      - code: resource-example-cache-fields-version-mismatch
        severity: error
      - code: prompt-example-result-version-mismatch
        severity: error
      - code: completion-example-result-version-mismatch
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-prompt-example-semantics.json
        pointer: /prompts/0/examples/unknown-and-missing/result
      - path: expected-invalid/invalid-completion-example-semantics.json
        pointer: /prompts/3/completionExamples/missing-result-type/result
      - path: expected-valid/named-tool-examples.json
        pointer: /tools/0/examples
      - path: expected-valid/named-resource-examples.json
        pointer: /resources/0/examples
      - path: expected-warning/legacy-result-meta.json
        pointer: /resources/0/examples/with-result-meta/result
      - path: expected-warning/open-results-shared-across-revisions.json
        pointer: /tools/0/examples/paris/result
    notes: >-
      Fields a revision does not define are governed by
      mcp.result.additional-properties.preserve (accepted with a warning).
      When present, resultType must be "complete", ttlMs non-negative, and
      cacheScope "public" or "private" in every revision (document schema).

  - id: mcpdesc.example.completed-result-form
    title: "Show completed results without message envelopes"
    description: >-
      An example result is the completed payload, not a JSON-RPC response or a
      pending workflow. Remove envelope fields such as jsonrpc and id and do
      not include task or input-required state. Multi-step interactions belong
      in the explicit interaction example structure.
    owner: mcpdesc
    summary: >-
      An example result is a completed result payload: it contains no JSON-RPC
      envelope field and no non-completed workflow field.
    surface: Example result
    kind: mcpdesc-semantic
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Sections 3.6, 9.3, 10.4.4, 10.4.6, 11.3, and 11.4
        locations:
          - sections/09-tools.md#req-tool-example-completed-form
          - sections/10-resources.md#req-resource-example-completed-form
          - sections/11-prompts.md#req-prompt-example-completed-form
    sources:
      - tier: 1
        reference: MCP 2026-07-28 schema.ts, InputRequiredResult (inputRequests, requestState) and Result.resultType
        locations:
          - validation/mcp-schemas/2026-07-28/schema.ts#L571-L595
          - validation/mcp-schemas/2026-07-28/schema.ts#L218-L236
      - tier: 1
        reference: MCP 2025-11-25 schema.ts, CreateTaskResult (task)
        locations:
          - validation/mcp-schemas/2025-11-25/schema.ts#L1386-L1393
    diagnostics:
      - code: tool-example-json-rpc-envelope
        severity: error
      - code: prompt-example-json-rpc-envelope
        severity: error
      - code: resource-example-json-rpc-envelope
        severity: error
      - code: completion-example-json-rpc-envelope
        severity: error
      - code: incomplete-tool-example-result
        severity: error
      - code: incomplete-prompt-example-result
        severity: error
      - code: incomplete-resource-example-result
        severity: error
      - code: incomplete-completion-example-result
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-tool-example-result-semantics.json
        pointer: /tools/3/examples/task-result/result
      - path: expected-invalid/invalid-prompt-example-semantics.json
        pointer: /prompts/3/examples/task-state/result
      - path: expected-invalid/resource-example-result-semantics.json
        pointer: /resources/0/examples/invalid-result/result
      - path: expected-invalid/invalid-completion-example-semantics.json
        pointer: /prompts/2/completionExamples/bad-membership/result
    notes: >-
      Envelope fields are jsonrpc, id, and error. Non-completed workflow
      fields are task, inputRequests, and requestState. They are excluded from
      the field classification of mcp.result.additional-properties.preserve.

  - id: mcp.completion.context.revision-availability
    title: "Use completion context only where supported"
    description: >-
      Completion context was added in MCP 2025-06-18. A completion example
      spanning an earlier supported version cannot carry that context
      unchanged. Split the declaration's scopes when context is needed for
      only the newer versions.
    owner: mcp
    summary: >-
      A completion example carries context only from MCP 2025-06-18, where
      CompleteRequest defines it.
    surface: CompleteRequest
    path: context
    kind: structural
    requirement: must
    applicability:
      protocolVersions:
        "2024-11-05": not-applicable
        "2025-03-26": applies
        "2025-06-18": applies
        "2025-11-25": applies
        "2026-07-28": applies
    specification:
      - reference: MCP Description 0.9.0, Sections 10.4.6 and 11.4
        locations:
          - sections/10-resources.md#req-template-completion-context-revision
          - sections/11-prompts.md#req-prompt-completion-context-revision
    sources:
      - tier: 1
        reference: MCP 2025-03-26 schema.ts, interface CompleteRequest (no context); MCP 2025-06-18 to 2026-07-28 schema.ts, CompleteRequest params context
        locations:
          - validation/mcp-schemas/2025-03-26/schema.ts#L1092-L1113
          - validation/mcp-schemas/2025-06-18/schema.ts#L1307-L1340
          - validation/mcp-schemas/2025-11-25/schema.ts#L1995-L2025
          - validation/mcp-schemas/2026-07-28/schema.ts#L2582-L2618
    diagnostics:
      - code: completion-example-context-version-mismatch
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-completion-example-semantics.json
        pointer: /prompts/1/completionExamples/context-too-early
    notes: MCP Description does not support completion examples for MCP 2024-11-05 (mcp.completion.revision-availability).

  - id: mcpdesc.completion-example.target
    title: "Complete a declared argument or template variable"
    description: >-
      A completion example must target a Prompt argument or Resource Template
      variable that exists. Context entries must name other declared targets,
      not repeat the argument being completed. Correct the example names or
      the declaration they describe.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      A completion example completes a declared Prompt argument or URI template
      variable, and its context names other declared arguments or variables
      only.
    surface: Completion example
    path: argument, context
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Sections 10.4.6 and 11.4
        locations:
          - sections/10-resources.md#req-template-completion-target
          - sections/11-prompts.md#req-prompt-completion-target
    sources:
      - tier: 1
        reference: "MCP 2025-06-18 to 2026-07-28 schema.ts, CompleteRequest context.arguments (previously-resolved variables in a URI template or prompt)"
        locations:
          - validation/mcp-schemas/2025-06-18/schema.ts#L1307-L1340
          - validation/mcp-schemas/2025-11-25/schema.ts#L1995-L2025
          - validation/mcp-schemas/2026-07-28/schema.ts#L2582-L2618
    diagnostics:
      - code: prompt-completion-example-unknown-argument
        severity: error
      - code: prompt-completion-example-context-unknown-argument
        severity: error
      - code: resource-template-completion-example-unknown-variable
        severity: error
      - code: resource-template-completion-example-context-unknown-variable
        severity: error
      - code: completion-example-duplicate-target-context
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-completion-example-semantics.json
        pointer: /prompts/2/completionExamples/bad-membership/argument
      - path: expected-valid/named-completion-examples.json
        pointer: /prompts/0/completionExamples

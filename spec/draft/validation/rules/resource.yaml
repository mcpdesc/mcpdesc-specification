rules:
  - id: mcp.resource-template.uri-template
    title: "Use a valid Resource Template expression"
    description: >-
      Every Resource Template must contain a valid RFC 6570 URI template, even
      if it has no examples. Correct malformed braces, operators, or variable
      syntax before checking concrete expansions. The validator does not
      retrieve the resulting URI.
    owner: mcp
    summary: A Resource Template uriTemplate is a valid RFC 6570 URI template.
    surface: ResourceTemplate
    path: uriTemplate
    kind: embedded-standard
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Section 10.2.1
        locations:
          - sections/10-resources.md#req-resource-template-uri-template
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface ResourceTemplate, uriTemplate ("A URI template (according to RFC 6570)")
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L456-L461
          - validation/mcp-schemas/2025-03-26/schema.ts#L489-L494
          - validation/mcp-schemas/2025-06-18/schema.ts#L570-L575
          - validation/mcp-schemas/2025-11-25/schema.ts#L846-L851
          - validation/mcp-schemas/2026-07-28/schema.ts#L1482-L1487
      - tier: 2
        reference: RFC 6570, URI Template
        locations:
          - https://www.rfc-editor.org/rfc/rfc6570#section-3
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/malformed-uri-template-without-examples.json
        pointer: /resourceTemplates/0
        outcome: error
      - path: expected-invalid/malformed-resource-template-example.json
        pointer: /resourceTemplates/0
        outcome: error
      - path: expected-invalid/invalid-completion-example-semantics.json
        pointer: /resourceTemplates/0
        outcome: error
    notes: >-
      Reported once per Resource Template, whether or not it has examples;
      example checks that need the parsed template are skipped.

  - id: mcp.resource-contents.blob.base64
    title: "Encode binary Resource Contents as base64"
    description: >-
      A Resource example's blob must be valid base64. Check the encoding
      rather than placing raw binary or a URL in the field. Encoded content
      remains untrusted, and a valid encoding does not establish that the
      resource exists or is safe to open.
    owner: mcp
    summary: A blob in Resource Contents is canonical base64.
    surface: BlobResourceContents
    path: blob
    kind: structural
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Section 10.4.4
        locations:
          - sections/10-resources.md#req-resource-example-blob-base64
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface BlobResourceContents, blob (@format byte)
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L507-L512
          - validation/mcp-schemas/2025-03-26/schema.ts#L545-L550
          - validation/mcp-schemas/2025-06-18/schema.ts#L637-L642
          - validation/mcp-schemas/2025-11-25/schema.ts#L913-L918
          - validation/mcp-schemas/2026-07-28/schema.ts#L1549-L1554
      - tier: 2
        reference: RFC 4648, Section 4
        locations:
          - https://www.rfc-editor.org/rfc/rfc4648#section-4
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/resource-example-result-semantics.json
        pointer: /resources/0/examples/invalid-result/result/contents/0
        outcome: error

  - id: mcpdesc.resource.example.consistency
    title: "Keep Resource examples consistent with declarations"
    description: >-
      Resource example contents are compared with the declaration's requested
      URI, MIME type, and declared raw size. A mutable resource can differ
      between observations, so size differences are warnings. Review the
      example and declaration together rather than inferring live content.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      Resource example contents agree with their declaration: the requested
      URI is returned, MIME types match, and raw size matches a declared size.
    surface: Resource example
    path: result.contents
    kind: mcpdesc-semantic
    requirement: should
    specification:
      - reference: MCP Description 0.9.0, Section 10.4.4
        locations:
          - sections/10-resources.md#req-resource-example-requested-uri
          - sections/10-resources.md#req-resource-example-mime-type
          - sections/10-resources.md#req-resource-example-size
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-warning/resource-example-consistency.json
        pointer: /resources/0/examples/collection-snapshot/result
        outcome: warning
    notes: Collections and indirect reads may legitimately differ, so these are warnings.

  - id: mcpdesc.resource-template.example.expansion
    title: "Use a concrete URI that expands the template"
    description: >-
      A Resource Template example records the concrete requested URI, which
      must be an RFC 6570 expansion of the containing template. Check the
      template and URI together, including examples reached through
      components. Matching a URI does not require network retrieval.
    applicability:
      protocolVersions: independent
    owner: mcpdesc
    summary: >-
      A Resource Template example uri is a valid RFC 6570 expansion of the
      template.
    surface: Resource Template example
    path: uri
    kind: mcpdesc-semantic
    requirement: must
    specification:
      - reference: MCP Description 0.9.0, Section 10.4.3
        locations:
          - sections/10-resources.md#req-resource-template-example-expansion
    sources:
      - tier: 2
        reference: RFC 6570, URI Template
        locations:
          - https://www.rfc-editor.org/rfc/rfc6570#section-3
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/resource-example-result-semantics.json
        pointer: /resourceTemplates/0/examples/not-an-expansion
        outcome: error
      - path: expected-invalid/component-contextual-examples.json
        pointer: /components/resourceTemplateExamples/bad-uri
        outcome: error
      - path: expected-valid/named-resource-examples.json
        pointer: /resourceTemplates/0
        outcome: passes

  - id: mcp.resource.uri
    title: "Identify resources with absolute URIs"
    description: >-
      A Resource uri is a URI as defined by RFC 3986, with a scheme; a relative
      reference or free text is invalid. Any scheme is allowed, including
      custom ones. MCP types the field as a URI, so a value that is not one
      cannot be projected to a native MCP Resource.
    owner: mcp
    summary: >-
      Resource uri is an RFC 3986 URI with a scheme.
    surface: Resource
    path: uri
    kind: structural
    documentSchema:
      - "#/$defs/resource/properties/uri"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Sections 10.1.2 and 15
        locations:
          - sections/10-resources.md#req-resource-uri-syntax
          - sections/15-serialization.md#req-serialization-value-formats
    sources:
      - tier: 1
        reference: "MCP 2024-11-05 to 2026-07-28 schema.ts, interface Resource, uri (@format uri)"
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L419-L423
          - validation/mcp-schemas/2025-03-26/schema.ts#L447-L451
          - validation/mcp-schemas/2025-06-18/schema.ts#L528-L532
          - validation/mcp-schemas/2025-11-25/schema.ts#L804-L808
          - validation/mcp-schemas/2026-07-28/schema.ts#L1443-L1447
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/invalid-resource-uri.json
        pointer: /resources/0/uri
        outcome: error
      - path: expected-invalid/invalid-resource-uri.json
        pointer: /resources/1/uri
        outcome: error

  - id: mcp.resource.size
    title: "Express resource sizes as integers"
    description: >-
      Resource declarations and resource-link content express raw size as an
      integer, following MCP's numeric schema convention. Replace a fractional
      value with the intended integer; the validator must not round it. No
      minimum is added beyond MCP's definition.
    owner: mcp
    summary: >-
      Resource size, in a declaration and in resource link content, is an
      integer when present.
    surface: Resource
    path: size
    kind: structural
    documentSchema:
      - "#/$defs/resource/properties/size"
      - "#/$defs/toolResultContent/oneOf/3/properties/size"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Sections 3.6 and 10.1.1
        locations:
          - sections/10-resources.md#req-resource-size-integer
          - sections/03-document-structure.md#req-mcp-integer-numbers
      - reference: Proposal 0029, Integer MCP Numbers
        locations:
          - proposal-snapshots/0029-integer-mcp-numbers.md
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface Resource, size (unannotated number); ResourceLink extends Resource from 2025-06-18
        locations:
          - validation/mcp-schemas/2024-11-05/schema.ts#L449
          - validation/mcp-schemas/2025-03-26/schema.ts#L482
          - validation/mcp-schemas/2025-06-18/schema.ts#L556
          - validation/mcp-schemas/2025-11-25/schema.ts#L832
          - validation/mcp-schemas/2026-07-28/schema.ts#L1471
          - validation/mcp-schemas/2026-07-28/schema.ts#L1719-L1721
      - tier: 3
        reference: MCP generated schema.json, Resource and ResourceLink size typed integer
        locations:
          - validation/mcp-schemas/2024-11-05/schema.json#L1508-L1511
          - validation/mcp-schemas/2026-07-28/schema.json#L2760-L2763
          - validation/mcp-schemas/2026-07-28/schema.json#L2830-L2833
      - tier: 3
        reference: "MCP scripts/generate-schemas.ts: typescript-json-schema --defaultNumberType integer"
        locations:
          - https://github.com/modelcontextprotocol/modelcontextprotocol/blob/dae694f61a31f7a3ec2af3aff709e11f70f61e48/scripts/generate-schemas.ts#L95
    enforcement: internal
    status: arbitrated
    fixtures:
      - path: expected-invalid/fractional-resource-size.json
        pointer: /resources/0/size
        outcome: error
      - path: expected-invalid/fractional-resource-link-size.json
        pointer: /tools/0/examples/listing/result/content/0/size
        outcome: error
      - path: expected-valid/named-resource-examples.json
        pointer: /resources/2/size
        outcome: passes
    arbitrations:
      - revisions: ["2024-11-05", "2025-03-26", "2025-06-18", "2025-11-25", "2026-07-28"]
        conflict: >-
          schema.ts declares size as number, which TypeScript cannot restrict
          to integers; the generated schema.json types it as integer.
        authority: >-
          MCP's schema generation configuration (--defaultNumberType integer),
          under which an unannotated number denotes an integer and fields that
          accept fractions carry @TJS-type number, such as Annotations.priority.
        behavior: Reject a non-integer size with schema-validation. No minimum is applied, as MCP defines none.
        rationale: >-
          The integer output is MCP's deliberate convention, not a generator
          defect. Following it keeps native projection valid against the
          generated schema and matches what MCP tooling validates.
        reviewTrigger: MCP changes its generator configuration or annotates size with @TJS-type number.
        status: active

  - id: mcpdesc.resource.members
    title: "Declare Resources and templates with their fields"
    description: >-
      A Resource has a uri and a name; a Resource Template has a uriTemplate and
      a name. Both accept only the properties of their Section 10 tables, each
      with its defined type.
    owner: mcpdesc
    summary: >-
      Resource and Resource Template Objects have their required fields,
      defined property types, and no unknown properties.
    surface: Resource, ResourceTemplate
    kind: structural
    documentSchema:
      - "#/$defs/resource"
      - "#/$defs/resourceTemplate"
    requirement: must
    applicability:
      protocolVersions: independent
    specification:
      - reference: MCP Description 0.9.0, Sections 10.1.1 and 10.2.1
        locations:
          - sections/10-resources.md#req-resource-fields
          - sections/10-resources.md#req-resource-template-fields
          - sections/13-tags.md#req-entity-tags-shape
          - sections/13-tags.md#req-entity-tags-unique
    enforcement: internal
    status: internal
    fixtures:
      - path: expected-invalid/malformed-info-transport-tag-resource.json
        pointer: "/resources/0"
        outcome: error

rules:
  - id: mcp.resource-template.uri-template
    owner: mcp
    summary: A Resource Template uriTemplate is a valid RFC 6570 URI template.
    surface: ResourceTemplate
    path: uriTemplate
    kind: embedded-standard
    requirement: must
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface ResourceTemplate, uriTemplate ("A URI template (according to RFC 6570)")
      - tier: 2
        reference: RFC 6570, URI Template
      - tier: 8
        reference: MCP Description 0.9.0, Section 10.2.1
    diagnostics:
      - code: invalid-resource-template-uri-template
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/malformed-uri-template-without-examples.json
      - expected-invalid/malformed-resource-template-example.json
      - expected-invalid/invalid-completion-example-semantics.json
    notes: >-
      Reported once per Resource Template, whether or not it has examples;
      example checks that need the parsed template are skipped.

  - id: mcp.resource-contents.blob.base64
    owner: mcp
    summary: A blob in Resource Contents is canonical base64.
    surface: BlobResourceContents
    path: blob
    kind: structural
    requirement: must
    applicability:
      "2024-11-05": applies
      "2025-03-26": applies
      "2025-06-18": applies
      "2025-11-25": applies
      "2026-07-28": applies
    sources:
      - tier: 1
        reference: MCP 2024-11-05 to 2026-07-28 schema.ts, interface BlobResourceContents, blob (@format byte)
      - tier: 2
        reference: RFC 4648, Section 4
      - tier: 8
        reference: MCP Description 0.9.0, Section 10.4.4
    diagnostics:
      - code: invalid-resource-example-base64
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/resource-example-result-semantics.json

  - id: mcpdesc.resource.example.consistency
    owner: mcpdesc
    summary: >-
      Resource example contents agree with their declaration: the requested
      URI is returned, MIME types match, and raw size matches a declared size.
    surface: Resource example
    path: result.contents
    kind: mcpdesc-semantic
    requirement: should
    sources:
      - tier: 8
        reference: MCP Description 0.9.0, Section 10.4.4
    diagnostics:
      - code: resource-example-requested-uri-not-returned
        severity: warning
      - code: resource-example-mime-type-mismatch
        severity: warning
      - code: resource-example-size-mismatch
        severity: warning
    enforcement: internal
    status: internal
    fixtures:
      - expected-warning/resource-example-consistency.json
    notes: Collections and indirect reads may legitimately differ, so these are warnings.

  - id: mcpdesc.resource-template.example.expansion
    owner: mcpdesc
    summary: >-
      A Resource Template example uri is a valid RFC 6570 expansion of the
      template.
    surface: Resource Template example
    path: uri
    kind: mcpdesc-semantic
    requirement: must
    sources:
      - tier: 2
        reference: RFC 6570, URI Template
      - tier: 8
        reference: MCP Description 0.9.0, Section 10.4.3
    diagnostics:
      - code: resource-template-example-invalid-expansion
        severity: error
    enforcement: internal
    status: internal
    fixtures:
      - expected-invalid/resource-example-result-semantics.json
      - expected-invalid/component-contextual-examples.json
      - expected-valid/named-resource-examples.json

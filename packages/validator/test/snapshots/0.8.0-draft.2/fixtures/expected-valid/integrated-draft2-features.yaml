  version: 1.0.0
  x-example-owner: platform
protocolVersions: [2026-07-28]
securitySchemes:
  api-key:
    type: apiKey
    in: header
    name: X-API-Key
    x-example-rotation: managed
security:
  - api-key: []
provenance:
  records:
    source:
      kind: generated
      producer:
        name: description-generator
        version: 2.0.0
        x-example-team: platform
